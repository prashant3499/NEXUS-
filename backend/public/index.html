// The founder command bar handler: classify the input as NAVIGATION,
// INSTRUCTION, or QUESTION, and route accordingly. This is the AI-as-operating
// -layer: one bar to ask, act, or jump anywhere.
const FCMD_NAV = {
  cockpit:'cockpit', watchdog:'watchdog', today:'dashboard', dashboard:'dashboard',
  approvals:'approvals', cofounder:'cofounder', 'co-founder':'cofounder', ai:'cofounder',
  verticals:'verticals', audit:'audit', onboard:'onboard', orders:'orders',
  experiences:'experiences', cooperatives:'cooperatives', leads:'leads', funnel:'funnel',
  outreach:'outreach', schemes:'schemes', agents:'agents', controls:'controls'
};
function _fcmdResult(tag, cls, msg){
  const el=document.getElementById('fcmdResult'); if(!el)return;
  el.innerHTML='<span class="fc-tag '+cls+'">'+tag+'</span>'+msg;
}
async function _fcmdRun(input){
  const s=input.toLowerCase().trim();
  const inEl=document.getElementById('fcmdInput'); if(inEl) inEl.value='';
  // 1. NAVIGATION — "show/go to/open X"
  const navMatch=s.match(/^(?:show|go to|goto|open|jump to|take me to)\s+(.+)$/);
  if(navMatch || FCMD_NAV[s]){
    const target=FCMD_NAV[s]||FCMD_NAV[(navMatch&&navMatch[1]||'').replace(/\s+/g,'').replace(/^the/,'')]||Object.keys(FCMD_NAV).find(k=>(navMatch&&navMatch[1]||'').includes(k));
    if(target){ route.founder=target; _fcmdResult('Go','fc-nav','Opened '+target+'.'); render(); return; }
  }
  // 2. INSTRUCTION — route to the command endpoint (act).
  if(typeof _looksLikeCommand==='function' && _looksLikeCommand(s)){
    _fcmdResult('Working','fc-act','…');
    try{
      const confirm=!!window._fcmdPending && window._fcmdPending===s;
      const r=await authFetch('/api/cofounder/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:input,confirm})});
      const d=await r.json();
      if(d.blocked){ _fcmdResult('Blocked','fc-block',d.reason); window._fcmdPending=null; }
      else if(d.deferred){ _fcmdResult('Noted','fc-nav',d.reason); window._fcmdPending=null; }
      else if(d.needs_confirm){ _fcmdResult('Confirm','fc-act',d.preview+'  ›  Run the same instruction again to confirm.'); window._fcmdPending=s; }
      else if(d.applied){ _fcmdResult('Done','fc-act',(d.preview||'Applied.')); window._fcmdPending=null; }
      else if(d.error){ _fcmdResult('Error','fc-block',d.error); window._fcmdPending=null; }
      else { _fcmdResult('Hmm','fc-ask',d.reason||'Could not act on that.'); window._fcmdPending=null; }
    }catch(e){ _fcmdResult('Offline','fc-block','Can\u2019t reach the server to act. Start the platform and try again.'); }
    return;
  }
  // 3. QUESTION — answer grounded (local), and offer the full chat.
  if(typeof answerQuestion==='function'){
    _fcmdResult('Answer','fc-ask', answerQuestion(input)+'  ›  Open AI Co-founder for a full conversation.');
  } else {
    route.founder='cofounder'; render();
  }
}
window._fcmdRun=_fcmdRun;

// Does this message read like an instruction to change the platform (vs a
// question)? Mirrors the backend command surface so instructions get routed to
// the command endpoint, where the AI actually acts.
function _looksLikeCommand(msg){
  const s=String(msg||'').toLowerCase().trim();
  if(!s) return false;
  // Imperative verbs + a platform object, or an explicit invariant-bypass attempt.
  const verb=/(set|change|make|raise|lower|update|enable|disable|turn on|turn off|pause|resume|stop|start)\b/.test(s);
  const object=/(price|charge|plan|charity|donat|welfare|agent|watchdog|seo|cms|telecaller|sourcing|scheduler|autonomy|consent|minor|guardian|floor|loss|tier)/.test(s);
  const bypass=/(disable|turn off|remove|bypass|skip|ignore).*(consent|child|minor|guardian|never.?in.?loss|loss|floor|safety)/.test(s);
  return bypass || (verb && object);
}

async function _chatSend(userMessage){
  if (window._chat.busy) return null;
  window._chat.busy = true;

  // Append the user message to history
  window._chat.history.push({ role: 'user', content: userMessage });

  // Build a clean slice that respects tool_use/tool_result pair integrity
  const recent = _sliceForAPI(window._chat.history, 12);

  try {
    // ── INSTRUCTION vs QUESTION ──
    // If this reads like a command to change the platform ("set the karigar
    // price to 599", "pause the seo agent", "enable charity at 2%"), route it
    // to the command endpoint so the AI ACTS — not just talks about it. This
    // was the malfunction: instructions went to /ask (chat) and nothing
    // happened. Questions still go to /ask below.
    if (_looksLikeCommand(userMessage)) {
      try {
        // Two-step: preview, then confirm (so a price change isn't silent).
        const confirm = !!window._pendingCmd && window._pendingCmd.instruction === userMessage;
        const cr = await authFetch('/api/cofounder/command', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instruction: userMessage, confirm }),
        });
        const cd = await cr.json();
        let reply;
        if (cd.blocked) {
          reply = '🛡 ' + (cd.reason || 'That would breach a hard invariant and cannot be done.');
          window._pendingCmd = null;
        } else if (cd.deferred) {
          reply = '📝 ' + (cd.reason || 'Recorded as a change request for a safe, reviewed build.');
          window._pendingCmd = null;
        } else if (cd.needs_confirm) {
          reply = '⚙ ' + cd.preview + '\n\nSend the same instruction again to confirm, or change it.';
          window._pendingCmd = { instruction: userMessage };
        } else if (cd.applied) {
          reply = '✅ Done. ' + (cd.preview || 'Applied.') + (cd.result ? '\n\n' + JSON.stringify(cd.result) : '');
          window._pendingCmd = null;
        } else if (cd.error) {
          reply = '⚠ ' + cd.error;
          window._pendingCmd = null;
        } else {
          reply = cd.reason || 'I couldn\u2019t map that to a safe action.';
          window._pendingCmd = null;
        }
        window._chat.history.push({ role: 'assistant', content: reply });
        _persistConversation();
        return { ok: true, text: reply, command: true };
      } catch (e) {
        // command endpoint unreachable (e.g. opened as a static file) → explain
        const reply = 'I can act on instructions like that when the platform is running (it routes to the secure command endpoint). Right now I can\u2019t reach the server, so here\u2019s what I know:\n\n' + answerQuestion(userMessage);
        window._chat.history.push({ role: 'assistant', content: reply });
        _persistConversation();
        return { ok: false, text: reply };
      }
    }

    // Primary path: the SERVER-SIDE proxy. The Anthropic key lives on the
    // server, never in the browser — calling api.anthropic.com directly from
    // the page can't carry a key and is blocked by CORS, so that path never
    // actually worked. The proxy returns a grounded reply, or tells us the AI
    // isn't connected yet (no key) so we can fall back honestly.
    const recentMsgs = _sliceForAPI(window._chat.history, 12)
      .map(m => ({ role: m.role, content: typeof m.content === 'string' ? m.content : (Array.isArray(m.content) ? m.content.filter(b=>b.type==='text').map(b=>b.text).join('\n') : String(m.content)) }))
      .filter(m => m.content);
    const pr = await authFetch('/api/cofounder/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: recentMsgs, system: _chatSystemPrompt() }),
    });
    const pd = await pr.json();
    if (pd && pd.ok && pd.text) {
      window._chat.history.push({ role: 'assistant', content: pd.text });
      _persistConversation();
      return { ok: true, text: pd.text };
    }
    // No key / not connected → fall through to the local grounded fallback,
    // but surface WHY so the founder knows it's a setup step, not a bug.
    const fallback = (pd && pd.ai_connected === false ? '⚠ AI not connected (set ANTHROPIC_API_KEY on the server). Local answer:\n\n' : '') + answerQuestion(userMessage);
    window._chat.history.push({ role: 'assistant', content: fallback });
    _persistConversation();
    return { ok: false, text: fallback, not_connected: pd && pd.ai_connected === false };
  } catch (err) {
    // Network/proxy error: use the static answerQuestion for a useful reply.
    const fallback = answerQuestion(userMessage);
    window._chat.history.push({ role: 'assistant', content: fallback });
    _persistConversation();
    return { ok: false, text: fallback, error: err.message };
  } finally {
    window._chat.busy = false;
  }
}

/** Streaming chat send. Returns the final text string on success, or
 *  null if the loop guard tripped. THROWS on any other error (caller
 *  catches and falls back). Designed so the tool-use loop still works:
 *  we assemble the full content[] array from delta events, then if the
 *  message ended in tool_use we surface approval cards and send the
 *  tool_results back as a follow-up streamed call. */
async function _chatSendStreaming(initialMessages) {
  let messagesForApi = initialMessages;
  let loopGuard = 0;
  let finalText = '';

  while (loopGuard++ < 5) {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: _chatSystemPrompt(),
        tools: AI_toolsForAnthropic(),
        messages: messagesForApi,
        stream: true,
      }),
    });
    if (!response.ok) throw new Error('API returned ' + response.status);

    // Stream the SSE body and reconstruct the content[] array
    const result = await _consumeAnthropicStream(response);

    // Push the assistant turn with its content array (preserves tool_use)
    window._chat.history.push({ role: 'assistant', content: result.content });

    // Stop reason determines whether we loop for tools or we're done
    if (result.stopReason === 'tool_use') {
      // Surface every tool_use block for HITL approval, collect results
      const toolUseBlocks = result.content.filter(b => b.type === 'tool_use');
      const toolResults = [];
      for (const tu of toolUseBlocks) {
        const decision = await _awaitToolApproval(tu);
        if (decision.approved) {
          const execRes = await AI_executeTool(tu.name, tu.input);
          // Profit guard refusal — log distinctly and tell the AI it was refused
          if (execRes.refused) {
            AI_logTool({
              tool: tu.name, input: tu.input,
              decision: 'refused_by_profit_guard',
              result: null,
              error: execRes.reason,
              profit_guard: execRes.profit_guard,
            });
            toolResults.push({
              type: 'tool_result', tool_use_id: tu.id,
              content: `Profit guard refused this call: ${execRes.reason}. The platform must never operate at a loss. Suggest an alternative or use a cheaper tool.`,
              is_error: true,
            });
          } else {
            AI_logTool({
              tool: tu.name, input: tu.input, decision: 'executed',
              result: execRes.result || null,
              error: execRes.error || null,
              profit_guard: execRes.profit_guard,
            });
            toolResults.push({
              type: 'tool_result', tool_use_id: tu.id,
              content: execRes.ok ? JSON.stringify(execRes.result) : `Error: ${execRes.error}`,
              is_error: !execRes.ok,
            });
          }
        } else {
          AI_logTool({ tool: tu.name, input: tu.input, decision: 'rejected', result: null, error: null });
          toolResults.push({
            type: 'tool_result', tool_use_id: tu.id,
            content: 'The founder declined to run this tool. Continue without it.',
            is_error: false,
          });
        }
      }
      // Add tool results and loop
      window._chat.history.push({ role: 'user', content: toolResults });
      messagesForApi = _sliceForAPI(window._chat.history, 20);
      continue;
    }

    // end_turn / stop_sequence / max_tokens — we have a final answer
    finalText = result.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    if (!finalText) throw new Error('Empty response');
    // Normalize: store assistant turn as plain string for rendering
    // (replace the last entry which is the array-form turn)
    window._chat.history.pop();
    window._chat.history.push({ role: 'assistant', content: finalText });
    return finalText;
  }

  // Loop guard tripped — keep going honest with the founder.
  // Return the message as the final answer so _chatSend treats this
  // as a successful (if narrowing) response, not a fallback.
  const guardMsg = "I made several tool calls but couldn't finish a complete answer. Could you narrow the question, or ask me one specific thing at a time?";
  window._chat.history.push({ role: 'assistant', content: guardMsg });
  return guardMsg;
}

/** Consume an Anthropic SSE stream and return { content, stopReason }.
 *  Reconstructs the content[] array from delta events. Incrementally
 *  appends streamed text to the UI as it arrives. */
async function _consumeAnthropicStream(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const content = [];   // assembled blocks
  let stopReason = null;

  // Create or grab the streaming message bubble so we can append text
  // as it arrives. _renderChatHistory has already drawn the user turn;
  // we add an assistant bubble that we'll keep updating.
  const cfBody = document.getElementById('cfBody');
  let streamBubble = null;
  let streamText = '';
  const ensureBubble = () => {
    if (!cfBody) return;
    if (streamBubble) return;
    streamBubble = document.createElement('div');
    streamBubble.className = 'aimsg bot';
    cfBody.appendChild(streamBubble);
    cfBody.scrollTop = cfBody.scrollHeight;
  };
  const updateBubble = () => {
    if (!streamBubble) return;
    streamBubble.innerHTML = _renderChatMarkdown(streamText) + '<span style="opacity:.5;animation:pulse 1.2s infinite">▍</span>';
    cfBody.scrollTop = cfBody.scrollHeight;
  };

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    // SSE messages are separated by double newlines
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const json = line.slice(6).trim();
      if (!json) continue;
      let evt;
      try { evt = JSON.parse(json); } catch { continue; }

      if (evt.type === 'content_block_start') {
        // A new block is starting. For tool_use, the input arrives in
        // chunks via input_json_delta events — we accumulate as a string
        // and parse on content_block_stop. For text blocks, the text
        // accumulates via text_delta events.
        const block = { ...evt.content_block };
        if (block.type === 'tool_use') block.input = '';  // string accumulator
        if (block.type === 'text') block.text = block.text || '';
        content[evt.index] = block;
      } else if (evt.type === 'content_block_delta') {
        const block = content[evt.index];
        if (!block) continue;
        if (evt.delta.type === 'text_delta') {
          block.text = (block.text || '') + evt.delta.text;
          streamText += evt.delta.text;
          ensureBubble();
          updateBubble();
        } else if (evt.delta.type === 'input_json_delta') {
          // tool_use input arrives as a partial-JSON string in chunks
          block.input = (typeof block.input === 'string' ? block.input : '') + evt.delta.partial_json;
        }
      } else if (evt.type === 'content_block_stop') {
        // For tool_use blocks, parse the assembled JSON
        const block = content[evt.index];
        if (block && block.type === 'tool_use' && typeof block.input === 'string') {
          try { block.input = JSON.parse(block.input || '{}'); }
          catch { block.input = {}; }
        }
      } else if (evt.type === 'message_delta') {
        if (evt.delta.stop_reason) stopReason = evt.delta.stop_reason;
      } else if (evt.type === 'error') {
        throw new Error(evt.error && evt.error.message || 'API stream error');
      }
    }
  }

  // Remove the cursor on the final bubble (text-only assistant turn)
  if (streamBubble && streamText) {
    streamBubble.innerHTML = _renderChatMarkdown(streamText);
  } else if (streamBubble) {
    // No text streamed (pure tool_use response) — remove the empty bubble
    streamBubble.remove();
  }

  return { content: content.filter(Boolean), stopReason };
}

/** Display a tool-use card and wait for the founder to approve or reject.
 *  Returns { approved: boolean }. Auto-approves AUTO-tier tools after a
 *  short visible delay; MANUAL-tier tools wait for an explicit click. */
function _awaitToolApproval(toolUse) {
  return new Promise((resolve) => {
    const cfBody = document.getElementById('cfBody');
    if (!cfBody) return resolve({ approved: false });

    const tool = AI_TOOLS[toolUse.name];
    const isMutating = tool && tool.mutating;
    const isAuto = tool && tool.autonomy === AI_TOOL_AUTONOMY.AUTO && !tool.sensitive && !isMutating;
    const inputPretty = JSON.stringify(toolUse.input, null, 2);

    // Mutating-tool special preview — show before/after explicitly
    // so the founder sees what will change before approving.
    let mutationPreview = '';
    if (isMutating && toolUse.name === 'transition_lead') {
      const leads = (window._SRC && window._SRC.leads) || [];
      const lead = leads.find(l => l.id === toolUse.input.lead_id);
      if (lead) {
        mutationPreview = `
          <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:6px;padding:9px 11px;margin:0 0 9px;font-size:12.5px">
            <div style="font-size:10px;color:#92400e;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:5px">⚠ Will change this lead</div>
            <div style="color:#1a1a1a;font-weight:500;margin-bottom:5px">${lead.name}</div>
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)">
              <span style="background:#f3f4f6;padding:2px 8px;border-radius:4px;font-family:Spline Sans Mono,monospace">${lead.status}</span>
              <span style="color:var(--ink3)">→</span>
              <span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:4px;font-family:Spline Sans Mono,monospace;font-weight:600">${toolUse.input.new_status}</span>
            </div>
            ${toolUse.input.note ? `<div style="margin-top:6px;font-size:11.5px;color:var(--ink2);font-style:italic">Note: ${toolUse.input.note.replace(/</g,'&lt;')}</div>` : ''}
          </div>`;
      } else {
        mutationPreview = `<div style="color:var(--red);font-size:11.5px;margin-bottom:7px">⚠ Lead ${toolUse.input.lead_id} not found in current state — call will fail.</div>`;
      }
    }

    // Tier badge: AUTO (blue), MANUAL (red), MUTATING (amber + warning)
    const tierBadge = isMutating
      ? '<span style="font-size:11px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase">mutating</span>'
      : `<span style="font-size:11px;background:${isAuto?'#dbeafe':'#fee2e2'};color:${isAuto?'#1e40af':'#991b1b'};padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase">${isAuto?'auto':'manual approval'}</span>`;

    // Profit guard preflight — for server-backed tools, show the projected
    // cost before the founder approves. Placeholder until /api/profit/check
    // responds.
    const profitPreflightId = 'pf_' + Math.random().toString(36).slice(2, 8);
    const profitPreflightSlot = tool && tool.server_backed
      ? `<div id="${profitPreflightId}" style="font-size:11px;color:var(--ink3);margin-bottom:8px;font-family:Spline Sans Mono,monospace">Calculating cost…</div>`
      : '';

    const card = document.createElement('div');
    card.className = 'cmsg';
    card.style.cssText = 'background:#fffaee;border:1px solid #f4d4a4;border-radius:8px;padding:11px 13px;margin:4px 0;font-size:12.5px';
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        ${tierBadge}
        <span style="font-weight:500;color:var(--ink)">${tool ? tool.name : toolUse.name}</span>
        ${tool && tool.sensitive ? '<span style="font-size:10px;color:var(--red);font-weight:600;letter-spacing:0.5px">SENSITIVE — returns PII</span>' : ''}
      </div>
      <div style="color:var(--ink2);font-size:12px;margin-bottom:8px;line-height:1.5">${tool ? tool.description.split('.')[0] : ''}.</div>
      ${mutationPreview}
      ${profitPreflightSlot}
      <pre style="background:var(--sunken);padding:7px 9px;border-radius:5px;font-family:Spline Sans Mono,monospace;font-size:11px;margin:0 0 9px;overflow:auto;line-height:1.5;max-height:140px">${inputPretty.replace(/</g,'&lt;')}</pre>
      <div class="tool-actions" style="display:flex;gap:8px;align-items:center">
        <button class="btn ${isMutating?'btn-saffron':'btn-saffron'} tool-approve" style="padding:5px 14px;font-size:12px">${isMutating?'Approve & change':isAuto?'Run':'Approve & run'}</button>
        <button class="btn tool-reject" style="padding:5px 14px;font-size:12px;color:var(--red);border-color:#e8b4b4">Decline</button>
        ${isAuto ? '<span class="tool-countdown" style="font-size:11px;color:var(--ink3);margin-left:auto">Auto-running in 3s — click decline to stop</span>' : ''}
      </div>
    `;
    cfBody.appendChild(card);
    cfBody.scrollTop = cfBody.scrollHeight;

    // Fire-and-forget profit guard preflight for server-backed tools
    if (tool && tool.server_backed) {
      fetch('/api/profit/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tool_name: toolUse.name,
          seller_id: window._currentSellerId || null,
        }),
      }).then(r => r.json()).then(pg => {
        const slot = document.getElementById(profitPreflightId);
        if (!slot) return;
        const costRupees = (pg.projected_cost_paise / 100).toFixed(2);
        const verdictColor = pg.verdict === 'approve' ? '#15803d' : pg.verdict === 'warn' ? '#92400e' : '#991b1b';
        const verdictBg = pg.verdict === 'approve' ? '#dcfce7' : pg.verdict === 'warn' ? '#fef3c7' : '#fee2e2';
        const headroomBit = pg.headroom_paise != null
          ? `· headroom ₹${(pg.headroom_paise/100).toFixed(0)}`
          : '';
        slot.innerHTML = `<span style="background:${verdictBg};color:${verdictColor};padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;margin-right:6px">${pg.verdict}</span>projected ₹${costRupees} ${headroomBit}`;
        // If profit guard would DENY, disable the approve button
        if (pg.verdict === 'deny') {
          const btn = card.querySelector('.tool-approve');
          if (btn) {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.title = pg.reason;
          }
        }
      }).catch(() => {
        const slot = document.getElementById(profitPreflightId);
        if (slot) slot.textContent = '(cost unavailable)';
      });
    }

    let resolved = false;
    const finish = (approved) => {
      if (resolved) return;
      resolved = true;
      clearTimeout(autoTimer);
      // Update the card to show what happened
      const actions = card.querySelector('.tool-actions');
      if (actions) {
        actions.innerHTML = approved
          ? '<span style="font-size:11px;color:var(--green);font-weight:600">✓ Ran</span>'
          : '<span style="font-size:11px;color:var(--ink3);font-weight:600">✕ Declined — AI will continue without this</span>';
      }
      resolve({ approved });
    };

    card.querySelector('.tool-approve').onclick = () => finish(true);
    card.querySelector('.tool-reject').onclick = () => finish(false);

    let autoTimer = null;
    if (isAuto) {
      // Auto-run AUTO-tier tools after 3 seconds (founder can cancel)
      // NEVER auto-run mutating tools — they always need explicit approval
      autoTimer = setTimeout(() => finish(true), 3000);
    }
  });
}

/** Minimal Markdown → HTML for inline chat rendering. Handles **bold**,
 *  *italic*, `code`, line breaks, and simple bullet lists. No <script>. */
function _renderChatMarkdown(text){
  // Escape HTML first
  let s = String(text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Bold + italic + code
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  s = s.replace(/`([^`\n]+)`/g, '<code style="background:var(--sunken);padding:1px 5px;border-radius:3px;font-family:Spline Sans Mono,monospace;font-size:90%">$1</code>');
  // Bullet lists (lines starting with - or *)
  const lines = s.split('\n');
  let out = '', inList = false;
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.+)$/);
    if (m) {
      if (!inList) { out += '<ul style="margin:6px 0;padding-left:22px">'; inList = true; }
      out += `<li style="margin-bottom:3px">${m[1]}</li>`;
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      out += line + '<br>';
    }
  }
  if (inList) out += '</ul>';
  // Collapse trailing <br>s
  return out.replace(/(<br>\s*)+$/, '');
}

/** Render the full conversation history into a container. */
function _renderChatHistory(container){
  if (!container) return;
  container.innerHTML = '';
  if (window._chat.history.length === 0) {
    const intro = document.createElement('div');
    intro.className = 'aimsg bot';
    intro.innerHTML = "Hello. I'm your AI co-founder. I read your live platform state — the HITL queue, the lead pipeline, the cost ledger, health checks, all of it. Ask me anything about the platform, the strategy, what to do next. I'll be direct.";
    container.appendChild(intro);
  }
  window._chat.history.forEach(m => {
    // Coerce content to a renderable string — array content (tool_use /
    // tool_result blocks from the Anthropic API) needs special handling
    // or we render "[object Object]" garbage.
    const text = _coerceHistoryContent(m.content);
    if (text === null) return;  // skip system/internal-only turns
    const el = document.createElement('div');
    el.className = 'aimsg ' + (m.role === 'user' ? 'me' : 'bot');
    if (m.role === 'user') {
      el.textContent = text;
    } else {
      el.innerHTML = _renderChatMarkdown(text);
    }
    container.appendChild(el);
  });
  // Pending indicator
  if (window._chat.busy) {
    const wait = document.createElement('div');
    wait.className = 'aimsg bot';
    wait.id = 'cfWait';
    wait.innerHTML = '<span style="opacity:.55">thinking…</span>';
    container.appendChild(wait);
  }
  container.scrollTop = container.scrollHeight;
}

/** Convert any history turn's `content` into a displayable string.
 *  Anthropic's API uses arrays of typed blocks during tool-use rounds:
 *    [{type:'text',text:'...'}, {type:'tool_use', ...}]
 *  We collapse those to a human-readable line. tool_result blocks
 *  on user turns get summarized to their tool name + status. Returns
 *  null if the turn has no useful content to display. */
function _coerceHistoryContent(content) {
  if (content == null) return null;
  if (typeof content === 'string') return content;
  if (!Array.isArray(content)) return String(content);
  // Array of typed blocks
  const parts = [];
  for (const block of content) {
    if (!block || typeof block !== 'object') continue;
    if (block.type === 'text' && block.text) parts.push(block.text);
    else if (block.type === 'tool_use') parts.push(`*[used \`${block.name}\` tool]*`);
    else if (block.type === 'tool_result') {
      // tool_result blocks on user turns — show a one-liner
      const status = block.is_error ? '✗ error' : '✓ result';
      // Try to peek at the tool_use_id for context, but it's opaque
      parts.push(`*[tool ${status}]*`);
    }
  }
  return parts.length > 0 ? parts.join('\n\n') : null;
}

/** Suggested first prompts — change based on platform state. */
function _chatSuggestedPrompts(){
  const s = _engineSnapshot();
  const leads = (window._SRC && window._SRC.leads) || [];
  const prompts = [];
  // Always-useful starters
  prompts.push("What's the most important thing for me to do today?");
  prompts.push("Walk me through the current state of the platform.");
  // State-aware prompts
  if (s.hitlQueue.length > 0) prompts.push(`Help me think through the ${s.hitlQueue.length} pending approval${s.hitlQueue.length>1?'s':''}.`);
  if (leads.length === 0)      prompts.push("Where should I source my first 20 leads from?");
  if (leads.length > 0 && leads.filter(l => l.status === 'onboarded').length === 0) {
    prompts.push("What's blocking these leads from becoming customers?");
  }
  if (s.customers.length === 0) prompts.push("Walk me through onboarding my first seller.");
  prompts.push("Which non-code gate should I close first to get to production?");
  prompts.push("Explain the unit economics at 100 paying customers.");
  return prompts.slice(0, 6);
}

function answerQuestion(q){
  const s=_engineSnapshot(); const ql=(q||'').toLowerCase();
  if(/queue|pending|approv|held/.test(ql)){
    if(!s.hitlQueue.length) return 'Nothing held right now. The queue is empty.';
    return `${s.hitlQueue.length} action${s.hitlQueue.length>1?'s':''} waiting on you. Highest severity: <b>${s.hitlQueue[0].severity||'med'}</b>. Open Approvals to decide.`;
  }
  if(/order|sale|gmv|revenue|settle/.test(ql)){
    if(!s.orders.length) return 'No orders yet — onboard a seller and list a product first.';
    const gmv=s.orders.reduce((sum,o)=>sum+(o.sell_price||0),0);
    const settled=s.orders.filter(o=>o.payment?.state==='settled').length;
    return `<b>${s.orders.length}</b> order${s.orders.length>1?'s':''} total · <b>${settled}</b> settled · GMV <b>₹${gmv.toLocaleString('en-IN')}</b>.`;
  }
  if(/seller|artisan|customer|merchant|model/.test(ql)){
    if(!s.customers.length) return 'No sellers yet. The status-aware selector is ready — assign a legal model to start.';
    const models={}; s.customers.forEach(c=>{models[c.model]=(models[c.model]||0)+1;});
    const mix=Object.entries(models).map(([m,n])=>`${n} ${_shortModel(m)}`).join(', ');
    return `<b>${s.customers.length}</b> seller${s.customers.length>1?'s':''}: ${mix}.`;
  }
  if(/product|listing|catalog/.test(ql)){
    if(!s.products.length) return 'No listings yet.';
    return `<b>${s.products.length}</b> listing${s.products.length>1?'s':''} across ${new Set(s.products.map(p=>p.vertical)).size} vertical(s).`;
  }
  if(/cost|spend|infer|gpu|bhashini/.test(ql)){
    return 'Phase-aware cost engine. Indic inference via Bhashini at ₹0; English via owned GPU; LLM API behind a monthly cap. 2% ceiling once GMV crosses ₹1L/mo.';
  }
  if(/float|escrow|money|gateway/.test(ql)){
    return 'Zero float by design: payments split at the gateway. The platform is never in the money path.';
  }
  const ins=generateInsights(s);
  // Capability / how-does-it-work / strategy — grounded in the real model.
  if(/what can you|help me|what do you do|capabilit|who are you/.test(ql)){
    return 'I\u2019m your AI co-founder. I can answer about your <b>orders, sellers, listings, the held queue, payouts, and costs</b>; explain how any part of the platform works (Merchant-of-Record, consent, never-in-loss, the legal models); and surface the <b>top priority</b> right now. Ask me things like \u201cwhat\u2019s pending?\u201d, \u201chow do payouts work?\u201d, or \u201cwhat should I do next?\u201d';
  }
  if(/how.*(work|merchant|mor|liability|legal|consent|tcs|gst|tax)/.test(ql)){
    if(/consent|authoriz/.test(ql)) return 'Consent-before-sale: a seller authorizes the platform to sell on their behalf at signup (terms, selling authorization, content licence, data, payouts). Nothing of theirs goes live until then, and they can withdraw any time \u2014 which takes their listings down.';
    if(/tcs|gst|tax/.test(ql)) return 'Where the platform is Merchant of Record, it collects and remits TCS under Section 52 CGST and accounts for GST on its commission \u2014 computed at source in the slicer, not by hand.';
    if(/minor|guardian|child/.test(ql)) return 'Minors can only participate through a verified guardian (Guardian-MoR): the guardian contracts and is paid; the minor never contracts. A minor without a guardian is blocked. Unknown age fails safe.';
    return 'The platform\u2019s role is status-aware: Merchant-of-Record for undocumented artisans (zero liability, we file the tax), SaaS for registered sellers, agent for tourism, umbrella for cooperatives, Guardian-MoR for minors. The model shown on each transaction is the one applied.';
  }
  if(/what.*next|priorit|should i|focus|launch|ready/.test(ql)){
    if(ins.length) return `The single highest-leverage thing right now: <b>${ins[0].text}</b>. Open the Cockpit for the full leadership view \u2014 the C-suite, SaaS metrics, and launch readiness.`;
    return 'Open the <b>Cockpit</b> \u2014 it shows your virtual C-suite worst-first, the SaaS scorecard (MRR/ARR/LTV:CAC), and launch readiness with the next action.';
  }
  if(ins.length) return `I don't have a direct answer \u2014 but the highest-priority thing right now is: <b>${ins[0].text}</b>`;
  return 'The engine is quiet. Try the <b>Cockpit</b> for the leadership view, or ask me \u201cwhat can you do?\u201d';
}
function runInsightAction(actionKey){
  const map={
    'goto:approvals':()=>{route.founder='approvals';render();},
    'goto:assign':()=>{route.founder='sell';render();},
    'goto:settlements':()=>{route.founder='checkout';render();},
    'goto:cofounder':()=>{route.founder='cofounder';render();},
    'goto:sellers':()=>{route.founder='dashboard';render();},
    'goto:agents':()=>{route.founder='agents';render();},
  };
  if(map[actionKey]) map[actionKey]();
}

async function aiAsk(q){
  const body = $('aiBody');
  if (!body || !q) return;
  // Show user message immediately
  const me = document.createElement('div'); me.className = 'aimsg me'; me.textContent = q; body.appendChild(me);
  // Pending indicator
  const wait = document.createElement('div'); wait.className = 'aimsg bot'; wait.innerHTML = '<span style="opacity:.55">thinking…</span>';
  body.appendChild(wait); body.scrollTop = body.scrollHeight;
  // Real call (shares conversation history with the full cofounder page)
  const result = await _chatSend(q);
  wait.remove();
  const bot = document.createElement('div'); bot.className = 'aimsg bot';
  bot.innerHTML = _renderChatMarkdown(result ? result.text : 'Could not reach the AI co-founder right now.');
  body.appendChild(bot); body.scrollTop = body.scrollHeight;
}

/* Language picker init — populates menu, wires open/close + selection */
(function initLangPicker(){
  const trigger=$('langTrigger');const menu=$('langMenu');const cur=$('langCurrent');
  if(!trigger||!menu)return;
  // Set initial label
  const curLocale=LOCALES.find(l=>l.code===LOCALE);
  if(cur&&curLocale)cur.textContent=curLocale.native;
  document.documentElement.setAttribute('lang',LOCALE);
  document.documentElement.setAttribute('dir',curLocale&&curLocale.rtl?'rtl':'ltr');
  // Populate menu — active locales are clickable; coming-soon are disabled
  menu.innerHTML=LOCALES.map(l=>`<button data-lc="${l.code}" class="${l.code===LOCALE?'on':''}"><span class="ln-native">${l.native}</span><span class="ln-code">${l.code.toUpperCase()}</span></button>`).join('')
    + (typeof LOCALES_COMING_SOON!=='undefined' && LOCALES_COMING_SOON.length
        ? `<div class="ln-soon-head">More coming soon</div>` + LOCALES_COMING_SOON.map(l=>`<button class="ln-soon" disabled aria-disabled="true"><span class="ln-native">${l.native}</span><span class="ln-code">${l.code.toUpperCase()}</span></button>`).join('')
        : '');
  // Toggle on trigger click
  trigger.onclick=(e)=>{e.stopPropagation();menu.classList.toggle('show');};
  // Close on outside click
  document.addEventListener('click',(e)=>{if(!menu.contains(e.target)&&e.target!==trigger)menu.classList.remove('show');});
  // Handle selection
  menu.querySelectorAll('button[data-lc]').forEach(b=>{
    b.onclick=()=>{setLocale(b.dataset.lc);menu.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.lc===LOCALE));menu.classList.remove('show');};
  });
})();

// ── PWA: register service worker for offline + install ──
// Skip on http://localhost dev (SW needs HTTPS or localhost, both work).
// Silent on failure so the SPA still loads if the SW can't register.
if ('serviceWorker' in navigator) {
  let _reloadingForSW = false;
  // When a NEW service worker takes control, reload once so the freshly
  // deployed build (with bug fixes) is what the user actually sees. Without
  // this, the old SW keeps controlling the loaded page and fixes appear
  // "not to work" until a manual refresh — the exact symptom reported.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_reloadingForSW) return;
    _reloadingForSW = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then((reg) => {
        // Proactively check for an updated SW on every load.
        reg.update().catch(() => {});
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              // A new version is ready — activate it immediately. The SW calls
              // skipWaiting() on install, and controllerchange (above) reloads.
              if (typeof toast === 'function') toast('Updating to the latest version…');
              sw.postMessage('SKIP_WAITING');
            }
          });
        });
      })
      .catch(() => {/* silent — SW is enhancement, not requirement */});
  });
}

// ── PWA: capture install prompt so we can show an Install button when supported ──
let _installPromptEvent = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _installPromptEvent = e;
  // Tell the UI we can offer install (the Settings panel reads this flag)
  window._canInstall = true;
});
window._installApp = function(){
  if (!_installPromptEvent) {
    if (typeof toast === 'function') toast('Install is already enabled, or your browser does not support it. On iOS Safari, use Share → Add to Home Screen.');
    return;
  }
  _installPromptEvent.prompt();
  _installPromptEvent.userChoice.then(() => { _installPromptEvent = null; window._canInstall = false; });
};
