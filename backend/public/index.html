/* Validate a tool call against its schema. Returns {ok, error}. */
function AI_validateToolCall(toolName, input) {
  const tool = AI_TOOLS[toolName];
  if (!tool) return { ok: false, error: `Unknown tool: ${toolName}` };
  if (input === null || typeof input !== 'object') return { ok: false, error: 'input must be an object' };
  const schema = tool.input_schema || {};
  for (const f of schema.required || []) if (input[f] === undefined) return { ok: false, error: `missing required: ${f}` };
  const props = schema.properties || {};
  for (const [k, v] of Object.entries(input)) {
    const spec = props[k]; if (!spec) continue;
    if (spec.enum && !spec.enum.includes(v)) return { ok: false, error: `${k} must be one of: ${spec.enum.join(', ')}` };
    if (spec.type === 'string' && typeof v !== 'string') return { ok: false, error: `${k} must be a string` };
    if (spec.type === 'integer') {
      if (!Number.isInteger(v)) return { ok: false, error: `${k} must be an integer` };
      if (spec.minimum !== undefined && v < spec.minimum) return { ok: false, error: `${k} must be >= ${spec.minimum}` };
      if (spec.maximum !== undefined && v > spec.maximum) return { ok: false, error: `${k} must be <= ${spec.maximum}` };
    }
    if (spec.type === 'boolean' && typeof v !== 'boolean') return { ok: false, error: `${k} must be a boolean` };
  }
  return { ok: true };
}

/* Execute a tool — caller controls whether HITL approval already happened.
   Returns { ok, tool, autonomy, sensitive, result, error?, profit_guard? }.
   Handles both sync and async executors (server-backed tools return a
   promise; their result may include _refused=true if the profit guard
   denied the call). NEVER throws. */
async function AI_executeTool(toolName, input) {
  const v = AI_validateToolCall(toolName, input);
  if (!v.ok) return { ok: false, error: v.error };
  const tool = AI_TOOLS[toolName];
  try {
    let result = tool.executor(input || {});
    // Server-backed tools return a Promise
    if (result && typeof result.then === 'function') result = await result;
    // Profit guard denial — surface as a non-error refusal so the chat
    // shows a clear "platform cannot afford this" card instead of an exception
    if (result && result._refused) {
      return {
        ok: false,
        refused: true,
        tool: toolName,
        autonomy: tool.autonomy,
        error: 'Profit guard refused this call',
        reason: result.reason,
        profit_guard: { verdict: result.verdict || 'deny', projected_cost_paise: result.projected_cost_paise },
      };
    }
    // Server-backed result may carry profit_guard metadata
    const profitGuard = result && result.profit_guard ? result.profit_guard : null;
    return {
      ok: true, tool: toolName, autonomy: tool.autonomy,
      sensitive: tool.sensitive, mutating: tool.mutating || false,
      result, profit_guard: profitGuard,
    };
  } catch (e) {
    return { ok: false, error: 'Execution failed: ' + e.message };
  }
}

/* Anthropic-compatible tools array for inclusion in API call. */
function AI_toolsForAnthropic(opts) {
  const includeSensitive = opts && opts.includeSensitive === false ? false : true;
  return Object.values(AI_TOOLS).filter(t => includeSensitive || !t.sensitive)
    .map(t => ({ name: t.name, description: t.description, input_schema: t.input_schema }));
}

/* Tool-call audit log (in-memory, surfaces in the chat UI). */
window._toolAudit = window._toolAudit || [];
function AI_logTool(entry) {
  const id = 'tcall_' + Math.random().toString(36).slice(2, 10);
  const e = Object.freeze({ id, at: Date.now(), ...entry });
  window._toolAudit.unshift(e);
  if (window._toolAudit.length > 50) window._toolAudit.length = 50;
  // Re-render the audit panel if it's currently mounted
  if (typeof _renderToolAudit === 'function') _renderToolAudit();
  return e;
}

/* Roll back a successful transition_lead audit entry by re-running the
 * tool with the previous status. The audit entry stores previous_status
 * so we don't need any other lookup. Marks the entry as rolledBack so
 * the UI hides the button after. */
window._rollbackTransition = async function(auditId) {
  const audit = window._toolAudit || [];
  const i = audit.findIndex(e => e.id === auditId);
  if (i < 0) { toast('Rollback target not found in audit log'); return; }
  const entry = audit[i];
  if (entry.rolledBack) { toast('Already rolled back'); return; }
  if (!entry.result || !entry.result.ok || !entry.result.previous_status) {
    toast('Cannot roll back — missing previous_status'); return;
  }
  if (entry.tool !== 'transition_lead') { toast('Rollback only supported for transition_lead'); return; }
  // Confirm
  const leadName = entry.result.lead_name || entry.input.lead_id;
  if (!confirm(`Roll back ${leadName} to "${entry.result.previous_status}"? (currently "${entry.result.new_status}")`)) return;
  // Execute the reverse transition
  const r = await AI_executeTool('transition_lead', {
    lead_id: entry.input.lead_id,
    new_status: entry.result.previous_status,
    note: '[rollback] previous state restored',
  });
  if (!r.ok || (r.result && r.result.ok === false)) {
    const err = r.error || (r.result && r.result.error) || 'unknown error';
    toast('Rollback failed: ' + err);
    return;
  }
  // Mutate the original entry's rolledBack flag — re-create immutable entry
  audit[i] = Object.freeze({ ...entry, rolledBack: true });
  // Log a new audit entry for the rollback itself
  AI_logTool({
    tool: 'transition_lead',
    input: { lead_id: entry.input.lead_id, new_status: entry.result.previous_status },
    decision: 'executed',
    result: r.result,
    error: null,
    isRollback: true,
  });
  _renderToolAudit();
  toast(`Rolled back ${leadName} to ${entry.result.previous_status}`);
};

/* Render the in-page tool audit log (cofounder view).  Lists every
 * tool the AI has invoked this session — decision, tool name, input
 * summary, when. Decision badges color-coded: executed = green,
 * rejected = gray, failed = red. */
function _renderToolAudit() {
  const panel = document.getElementById('cfAudit');
  const counter = document.getElementById('cfAuditCount');
  if (!panel) return;
  const audit = window._toolAudit || [];
  if (counter) counter.textContent = audit.length === 1 ? '1 call' : audit.length + ' calls';
  if (audit.length === 0) {
    panel.innerHTML = '<div style="color:var(--ink3);font-size:12.5px;padding:6px 2px;line-height:1.55">No tool calls yet this session. When you ask the AI co-founder a question that benefits from live data (a lead lookup, funnel rollup, scheme eligibility check), it will request a tool — and every call lands here.</div>';
    return;
  }
  panel.innerHTML = audit.slice(0, 12).map(e => {
    const decisionColor = e.decision === 'executed' ? '#16a34a'
                        : e.decision === 'rejected' ? '#7a6f5e'
                        : e.decision === 'failed'   ? '#dc2626'
                        : '#5a5247';
    const decisionBg = e.decision === 'executed' ? '#dcfce7'
                     : e.decision === 'rejected' ? '#f5efe0'
                     : e.decision === 'failed'   ? '#fee2e2'
                     : '#fdf6ec';
    const inputSummary = e.input
      ? Object.entries(e.input).slice(0, 3).map(([k, v]) => `${k}=${JSON.stringify(v).slice(0, 30)}`).join(', ')
      : '(no input)';
    const ago = typeof _timeAgo === 'function' ? _timeAgo(e.at) : '';

    // Rollback affordance for successful transition_lead calls
    // The previous_status lives on result; if it's there and not yet rolled
    // back, render a one-click rollback button.
    const canRollback = e.decision === 'executed'
      && e.tool === 'transition_lead'
      && e.result && e.result.ok
      && e.result.previous_status
      && !e.rolledBack;
    const rollbackBtn = canRollback
      ? `<button class="btn" style="padding:3px 9px;font-size:10.5px;color:var(--brand);border-color:#f4d4a4;margin-top:4px" onclick="_rollbackTransition('${e.id}')" aria-label="Roll back this transition">⟲ Rollback to ${e.result.previous_status}</button>`
      : '';
    const rolledBackTag = e.rolledBack
      ? `<div style="font-size:10.5px;color:var(--ink3);margin-top:3px;font-style:italic">↩ rolled back</div>`
      : '';

    return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--hair2);font-size:12.5px">
      <span style="background:${decisionBg};color:${decisionColor};font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;flex-shrink:0;min-width:60px;text-align:center">${e.decision || '—'}</span>
      <div style="flex:1;min-width:0">
        <div style="color:var(--ink);font-weight:500;font-family:Spline Sans Mono,monospace;font-size:12px">${e.tool || '(unknown)'}</div>
        ${inputSummary !== '(no input)' ? `<div style="color:var(--ink3);font-size:11px;font-family:Spline Sans Mono,monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${inputSummary}</div>` : ''}
        ${e.error ? `<div style="color:var(--red);font-size:11px;margin-top:2px">${e.error}</div>` : ''}
        ${rollbackBtn}
        ${rolledBackTag}
      </div>
      <span style="color:var(--ink3);font-size:10.5px;flex-shrink:0">${ago}</span>
    </div>`;
  }).join('');
  // If panel is currently empty (no calls), it shows the explainer; if it
  // has any borders we should hide the top one
  if (panel.firstChild && panel.firstChild.style) panel.firstChild.style.borderTop = 'none';
}

/* Real funnel chart — trapezoid stages, proportional widths.
   Replaces the previous bar list with a true funnel visualization. */
function _funnelChartSVG(reached){
  const stages=[['new','New'],['researched','Researched'],['contacted','Contacted'],['responded','Responded'],['demo_scheduled','Demo scheduled'],['demo_done','Demo done'],['trialling','Trialling'],['onboarded','Onboarded']];
  const max=Math.max(1,...stages.map(([k])=>reached[k]||0));
  const W=600,STAGE_H=40,GAP=4,maxBarW=W*0.7,minBarW=40;
  const total=stages.length*STAGE_H+stages.length*GAP+20;
  let svg=`<svg viewBox="0 0 ${W} ${total}" style="width:100%;max-width:680px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fgrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fbd7a8"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
    </defs>`;
  stages.forEach(([k,label],i)=>{
    const count=reached[k]||0;
    const ratio=count/max;
    const barW=minBarW+(maxBarW-minBarW)*ratio;
    const x=(W-barW)/2;
    const y=10+i*(STAGE_H+GAP);
    const fill=count>0?'url(#fgrad)':'#f3eee5';
    const textColor=count>0?'#fffdf9':'#a39787';
    // Trapezoid that narrows slightly into the next stage (true funnel feel)
    const nextRatio=i<stages.length-1?Math.max(0,(reached[stages[i+1][0]]||0)/max):ratio*0.6;
    const nextBarW=minBarW+(maxBarW-minBarW)*nextRatio;
    const nx=(W-nextBarW)/2;
    svg+=`<polygon points="${x},${y} ${x+barW},${y} ${nx+nextBarW},${y+STAGE_H} ${nx},${y+STAGE_H}" fill="${fill}" stroke="#c2410c" stroke-width="${count>0?1.5:0.5}" stroke-opacity="${count>0?0.6:0.3}"/>`;
    svg+=`<text x="${W/2}" y="${y+STAGE_H/2+5}" text-anchor="middle" font-size="13" font-weight="600" fill="${textColor}" font-family="ui-sans-serif,system-ui">${label} · ${count}</text>`;
  });
  svg+=`</svg>`;
  return svg;
}

    <div class="grid g3">${A.map((a,i)=>`<div class="card pop"><div class="cpad"><div style="display:flex;align-items:center;gap:11px;margin-bottom:10px"><div class="li" style="width:38px;height:38px;background:var(--sunken)">${a[1]}</div><div style="font-weight:700">${i+1}. ${a[0]}</div><span class="bdg ${a[4]}" style="margin-left:auto">${a[3]}</span></div><p style="font-size:13px;color:var(--ink2)">${a[2]}</p></div></div>`).join('')}</div>`;},
  verticals(){const V=[['💎','Gems & Jewellery','D2C · B2B · EXIM · POS','plum'],['🏷️','GI-Tagged','all modalities','brand'],['🏺','Handicrafts & Decor','all modalities','amber'],['🌿','Sustainable Naturals','nature to nature','green'],['🗺️','Tourism — 7 types','risk-stratified','indigo']];
    return `<div class="phead"><h1>Verticals</h1><p>Each craft category is configuration, not code. A new vertical is a form entry.</p></div>
    <div class="grid g2">${V.map(v=>`<div class="card pop"><div class="cpad" style="display:flex;align-items:center;gap:14px"><div class="li" style="width:46px;height:46px;font-size:22px;background:var(--sunken)">${v[0]}</div><div style="flex:1"><div style="font-weight:700;font-size:15px">${v[1]}</div><div style="font-size:12px;color:var(--ink3)">${v[2]}</div></div><span class="bdg ${v[3]}">live</span></div></div>`).join('')}
    <div class="card pop" style="border-style:dashed"><div class="cpad" style="display:flex;align-items:center;gap:14px;color:var(--ink3)"><div class="li" style="width:46px;height:46px;font-size:22px;background:var(--sunken)">＋</div><div><div style="font-weight:700;font-size:15px;color:var(--ink2)">Add a vertical</div><div style="font-size:12px">config, not code</div></div></div></div></div>`;},
  cofounder(){
    return `<div class="phead"><h1>AI Co-founder</h1><p>Your operational partner — it <b>answers</b> questions about live platform state, and <b>acts</b> on plain-language instructions (hard invariants stay protected). Powered by Claude.</p></div>
    <div class="card" style="margin-bottom:14px;background:var(--brand-soft);border-color:#bfe0d9"><div class="cpad" style="padding:12px 16px;font-size:12.5px;color:var(--ink2)"><b>Try instructing it:</b> <span class="cfchip" onclick="var i=document.getElementById('cfInput');i.value='set the karigar price to 599';i.focus()">set the karigar price to 599</span> <span class="cfchip" onclick="var i=document.getElementById('cfInput');i.value='enable charity at 2% for artisan welfare';i.focus()">enable charity at 2%</span> <span class="cfchip" onclick="var i=document.getElementById('cfInput');i.value='pause the SEO agent';i.focus()">pause the SEO agent</span> — or ask \"what should I do next?\"</div></div>
    <div class="grid g2">
      <div class="card"><div class="chead"><h3>Ask anything</h3>
        <button class="btn" id="cfHistBtn" style="margin-left:auto;padding:5px 12px;font-size:11.5px" aria-label="Show conversation history">⌚ History</button>
        <button class="btn" id="cfNewBtn" style="padding:5px 12px;font-size:11.5px" aria-label="Start a new conversation">+ New</button>
        <span class="bdg indigo">live · grounded</span></div><div class="cpad">
        <div id="cfHistPanel" style="display:none;background:var(--sunken);border:1px solid var(--hair2);border-radius:8px;padding:10px 12px;margin-bottom:12px;max-height:240px;overflow-y:auto" role="region" aria-label="Conversation history">
          <div style="display:flex;align-items:center;margin-bottom:8px"><span style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600">Past conversations</span><button class="btn" id="cfHistCloseBtn" style="margin-left:auto;padding:2px 8px;font-size:11px" aria-label="Close history">✕</button></div>
          <div id="cfHistList" style="display:flex;flex-direction:column;gap:6px;font-size:12.5px">Loading…</div>
        </div>
        <div id="cfBody" style="display:flex;flex-direction:column;gap:9px;min-height:280px;max-height:480px;overflow-y:auto;padding-bottom:4px"></div>
        <div style="display:flex;gap:8px;margin-top:14px"><input class="inp" id="cfInput" placeholder="Ask about the queue, the funnel, the cost ledger, what to do next…"><button class="btn btn-saffron" id="cfSendBtn" style="padding:0 18px">Ask</button></div>
        <div style="font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.5">Conversation saves automatically — past conversations are in the history panel. If the AI is unreachable, you'll see a local fallback answer.</div>
      </div></div>
      <div class="card"><div class="chead"><h3>Priority &amp; suggestions</h3></div><div class="cpad" style="display:flex;flex-direction:column;gap:0" id="cfSugg"></div></div>
    </div>
    <div class="card" style="margin-top:18px"><div class="chead"><h3>Tool audit log</h3><span class="bdg gray" style="margin-left:auto" id="cfAuditCount">0 calls</span></div><div class="cpad" id="cfAudit" style="min-height:60px"></div></div>
    <div class="card" style="margin-top:18px"><div class="chead"><h3>How this works</h3></div><div class="cpad" style="font-size:13px;color:var(--ink2);line-height:1.7">
      <div>• The AI co-founder reads your <b>live platform state</b> on every question: HITL queue, lead pipeline, returns SLAs, cost ledger, health checks, the lot.</div>
      <div>• It can call <b>read-only tools</b> — search_leads, summarize_funnel, get_lead, check_scheme_eligibility — but every call surfaces inline in the chat for your approval first. The audit log above shows every call it has made this session.</div>
      <div>• It identifies, recommends, and surfaces evidence — but it does <b>not</b> execute irreversible actions. You approve.</div>
      <div>• Three autonomy tiers exist: <b>AUTO</b> (read-only, can run after 3s timeout), <b>NOTIFY</b> (runs but tells you), <b>MANUAL</b> (sensitive — explicit click needed, blocks PII tools).</div>
    </div></div>`;
  },
  approvals(){return `<div class="phead"><h1>Approvals</h1><p>Nothing risky happens without you. These actions are <b>held</b> — money does not move and filings do not submit until you decide.</p></div>
    ${CP.pending.length?CP.pending.map(it=>`<div class="card pop" style="margin-bottom:14px"><div class="chead"><h3>${it.summary}</h3>
      <span class="bdg ${it.twoPerson?'red':'amber'}" style="margin-left:auto">${it.twoPerson?'two-person':'your call'}</span></div><div class="cpad">
      <div style="margin-bottom:12px">${it.reasons.map(r=>`<div class="atrace" style="background:var(--gold-soft);border-color:#e8c78a;margin-bottom:6px"><span>⚑</span>${r}</div>`).join('')}</div>
      <div class="drow"><span class="k">Agent</span><span class="v">${it.agent}</span></div>
      <div class="drow"><span class="k">AI recommends</span><span class="v">${it.ai}</span></div>
      ${it.twoPerson?`<div class="drow"><span class="k">Approvals so far</span><span class="v">${[...new Set(it.approvals)].join(', ')||'none'}</span></div>`:''}
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-brand" style="flex:1" data-approve="${it.id}">✓ Approve${it.twoPerson?' (as Founder)':''}</button>
        ${it.twoPerson?`<button class="btn btn-sec" data-approve2="${it.id}">✓ Approve (as CA)</button>`:''}
        <button class="btn btn-sec" style="color:var(--red);border-color:#e8b4b4" data-reject="${it.id}">✕ Reject</button>
      </div></div></div>`).join(''):
      `<div class="card">${_emptyState('approvals','Approvals queue is empty','Nothing waiting on your decision. Take an export order in Orders & pay to see the autonomy loop hold an action that needs your eyes.',{label:'Go to Orders & pay →',onclick:"document.querySelector('[data-go=checkout]')?.click()"})}</div>`}`;},
  controls(){const agents=['Sourcing','Commerce','Finance','Compliance','Logistics','Marketing'];const cats=['gems','jewellery','gi','handicraft','naturals','tourism'];
    return `<div class="phead"><h1>Agent controls</h1><p>Your kill switches and dials. Pause any agent, force a category to manual review, or retune the thresholds — no code, effective immediately.</p></div>
    <div class="grid g2">
      <div class="card"><div class="chead"><h3>Pause / resume agents</h3></div><div class="cpad">
        ${agents.map(a=>`<div class="lrow"><div class="li" style="width:32px;height:32px;font-size:12px">${a[0]}</div><div style="flex:1"><div class="lt">${a} agent</div><div class="ld">${CP.paused.has(a)?'paused — all actions held':'running autonomously'}</div></div>
          <button class="btn btn-sec" style="min-height:36px;padding:7px 14px" data-pause="${a}">${CP.paused.has(a)?'Resume':'Pause'}</button></div>`).join('')}
      </div></div>
      <div class="card"><div class="chead"><h3>Force category to manual review</h3></div><div class="cpad">
        <div class="tog">${cats.map(c=>`<button class="${CP.force.has(c)?'on':''}" data-force="${c}"><span class="tk">${CP.force.has(c)?'✓':''}</span>${c}</button>`).join('')}</div>
        <p style="font-size:12px;color:var(--ink3);margin-top:12px">Any listing or order in a checked category will be held for your review, regardless of value.</p>
      </div></div>
      <div class="card" style="grid-column:1/-1"><div class="chead"><h3>Thresholds (no-code)</h3><span class="meta">effective on the next action</span></div><div class="cpad">
        ${[['finance','Money move → founder','₹'],['onboarding','New seller value → founder','₹'],['logistics','Shipment value → founder','₹'],['twoPerson','Two-person sign-off above','₹']].map(([k,l])=>`<div class="lrow"><div style="flex:1"><div class="lt">${l}</div></div>
          <div style="display:flex;align-items:center;gap:8px"><span style="color:var(--ink3)">₹</span><input class="inp" style="width:120px;min-height:38px" type="number" value="${CP.thresholds[k]/100}" data-thresh="${k}"></div></div>`).join('')}
      </div></div>
    </div>`;},
  trail(){const ok=CP.decisions.length;return `<div class="phead"><h1>Decision trail</h1><p>Every call you made, recorded immutably and hash-chained. This is the audit a regulator, an investor, or your future self can trust.</p></div>
    <div class="card"><div class="chead"><h3>Your decisions</h3><span class="meta">${ok} recorded · ${Math.round((CP.decisions.filter(d=>d.override).length/(ok||1))*100)}% overrode the AI</span></div><div class="cpad">
    ${ok?CP.decisions.map(d=>`<div class="lrow"><div class="li">${d.decision==='approved'?'✓':'✕'}</div><div style="flex:1"><div class="lt">${d.summary}</div>
      <div class="ld">${d.agent} · ${d.decision} by ${d.by.join(' + ')}${d.reason?' · "'+d.reason+'"':''}${d.override?' · OVERRODE AI':''}</div></div>
      <span class="bdg ${d.decision==='approved'?'green':'red'}">${d.decision}</span></div>`).join(''):
      _emptyState('decisions','No decisions logged yet','Approve or reject something in Approvals — every decision lands here with full audit trail.')}
    </div></div>`;},

  // ── SOURCING — Lead board ──
  leads(){
    if(!window._SRC.loaded&&!window._SRC.loading)_loadLeadsFromAPI();
    const leads = (window._SRC && window._SRC.leads) || [];
    const ranked = SRC_rankByPriority(leads);
    const all = leads.slice().sort((a,b) => b.score - a.score);
    return `<div class="phead"><h1>Lead board</h1><p>Remote customer acquisition. Sourced from public lists, scored by tier fit, status-tracked end-to-end.</p></div>
    <div class="grid g4" style="margin-bottom:18px">
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600">${leads.length}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Total leads</div></div></div>
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--brand)">${ranked.length}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Action queue</div></div></div>
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--saffron)">${leads.filter(l=>l.status==='onboarded').length}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Onboarded</div></div></div>
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--ink3)">${leads.filter(l=>l.status==='dormant').length}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Dormant</div></div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><div class="chead"><h3>Add a lead</h3></div><div class="cpad" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <select class="inp" id="ldSource"><option value="">Source —</option>${Object.entries(SRC_SOURCES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select>
      <select class="inp" id="ldSegment"><option value="">Segment —</option>${Object.entries(SRC_SEGMENTS).map(([k,v])=>`<option value="${v}">${k.toLowerCase()} prospect</option>`).join('')}</select>
      <input class="inp" id="ldName" placeholder="Lead name (e.g. Surat Diamond Co)">
      <input class="inp" id="ldContact" placeholder="WhatsApp / email">
      <div style="grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink2)">
        <label><input type="checkbox" id="sigHasGST"> Has GST</label>
        <label><input type="checkbox" id="sigHasIEC"> Has IEC</label>
        <label><input type="checkbox" id="sigHasGITag"> Has GI tag</label>
        <label><input type="checkbox" id="sigHasWebsite"> Has website</label>
        <label><input type="checkbox" id="sigExporting"> Exporting</label>
        <label><input type="checkbox" id="sigCooperative"> Is cooperative</label>
        <label><input type="checkbox" id="sigArtisan"> Registered artisan</label>
      </div>
      <button class="btn btn-saffron" style="grid-column:1/3" onclick="_addLead()">Add lead</button>
    </div></div>
    <div class="card"><div class="chead"><h3>All leads</h3><span class="meta">${all.length} total</span></div><div class="cpad">
    ${all.length ? all.map(l=>`<div class="lrow" style="align-items:flex-start"><div class="li" style="width:38px;height:38px;background:var(--sunken);font-weight:700;font-size:14px">${l.score}</div>
      <div style="flex:1"><div class="lt">${l.name}</div>
      <div class="ld">${(SRC_SOURCES[l.source]||{}).label||l.source} · suggested tier: <b>${l.suggestedTier}</b> · ${l.contactHandles.whatsapp||l.contactHandles.email||'(no contact)'}</div>
      <div style="font-size:11px;color:var(--ink3);margin-top:4px">Status: <b>${l.status}</b> · ${l.history.length} entr${l.history.length===1?'y':'ies'} in history</div></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${_leadActions(l)}
      </div></div>`).join('')
      : _emptyState('leads','No leads yet','Add your first one above. Suggested first sources: <b>GJEPC member directory</b> for gem exporters, <b>GI tag registry</b> for verified producers, <b>State handicraft boards</b> for individual artisans.')}
    </div></div>`;
  },

  // ── SOURCING — Funnel summary ──
  funnel(){
    if(!window._SRC.loaded&&!window._SRC.loading)_loadLeadsFromAPI();
    const leads = (window._SRC && window._SRC.leads) || [];
    const m = SRC_funnelMetrics(leads);
    if(leads.length===0){
      return `<div class="phead"><h1>Funnel</h1><p>Where are leads leaking? Conversion rates from contacted onwards.</p></div>
      <div class="card">${_emptyState('funnel','No leads to chart yet','Add a few leads on the Leads page. Once you have 5+ leads moving through stages, the funnel will show you where they leak — and the AI co-founder will tell you which step to fix first.')}</div>`;
    }
    return `<div class="phead"><h1>Funnel</h1><p>Where are leads leaking? Visualised stage-by-stage from new to onboarded.</p></div>
    <div class="grid g3" style="margin-bottom:18px">
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600">${m.totalLeads}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Total leads</div></div></div>
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--brand)">${m.onboardedCount}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Onboarded</div></div></div>
      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--saffron)">${m.overallConversionPct}%</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Overall conversion</div></div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><div class="chead"><h3>Stage funnel</h3><span class="meta">leads that have ever reached each stage</span></div><div class="cpad">
      ${_funnelChartSVG(m.reached||{})}
    </div></div>
    ${m.leakiestStep ? `<div class="card" style="border-left:3px solid var(--saffron)"><div class="chead"><h3>⚠ Leakiest step</h3></div><div class="cpad">
      <p style="font-size:15px;font-weight:600">${m.leakiestStep.replace(/_to_/g,' → ').replace(/_/g,' ')}</p>
      <p style="font-size:13px;color:var(--ink2);margin-top:8px">Only <b>${m.leakiestRatePct}%</b> of leads converted at this step. If this rate stays below 25%, investigate: is your message at this stage landing? Is timing right? Talk to leads who dropped here.</p>
    </div></div>` : ''}`;
  },

  // ── SOURCING — Outreach drafts ──
  outreach(){
    if(!window._SRC.loaded&&!window._SRC.loading)_loadLeadsFromAPI();
    const leads = (window._SRC && window._SRC.leads) || [];
    const actionable = leads.filter(l => ['new','researched','dormant'].includes(l.status));
    return `<div class="phead"><h1>Outreach drafts</h1><p>Pick a lead, pick a template, fill the placeholders, copy to WhatsApp / email.</p></div>
    ${actionable.length ? `<div class="card" style="margin-bottom:18px"><div class="chead"><h3>Choose a lead</h3></div><div class="cpad">
      <select class="inp" id="orLead" onchange="_renderOutreachPreview()"><option value="">Select a lead —</option>${actionable.map(l=>`<option value="${l.id}">${l.name} (${l.suggestedTier}, score ${l.score})</option>`).join('')}</select>
    </div></div>
    <div id="orPreview"><div class="card">${_emptyState('outreach','No draft yet','Pick a lead above and the right segment-matched template renders here — pre-filled where possible, with placeholders surfaced so you know what to complete before sending.')}</div></div>`
    : `<div class="card">${_emptyState('outreach','No actionable leads','Add leads from the Leads page (status: new / researched / dormant). Onboarded and rejected leads do not need outreach.')}</div>`}`;
  },

  // ── COOPERATIVES — multi-beneficiary settlement management ──
  cooperatives(){
    const coops = (window._COOPS && window._COOPS.items) || [];
    return `<div class="phead"><h1>Cooperatives</h1><p>Multi-beneficiary settlement. One sale splits T+2 to N artisan accounts with paise-exact reconciliation.</p></div>

      <div class="card"><div class="cpad" style="text-align:center"><div style="font-family:'Fraunces',serif;font-size:30px;font-weight:600">${coops.length}</div><div style="font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px">Cooperatives</div></div></div>

    </div>

    <div class="card" style="margin-bottom:18px"><div class="chead"><h3>Add a cooperative</h3></div><div class="cpad">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <input class="inp" id="coopName" placeholder="Cooperative name (e.g. Khurja Potters Guild)">
        <input class="inp" id="coopRegion" placeholder="Region (e.g. Khurja, Uttar Pradesh)">
      </div>
      <label style="display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px">Beneficiaries — one per line, format <code style="background:var(--sunken);padding:1px 5px;border-radius:3px">id | name | share_bps</code> (sum to 10000)</label>
      <textarea class="inp" id="coopBeneficiaries" style="min-height:120px;font-family:inherit;line-height:1.6" placeholder="p1 | Ramvati Devi | 3500&#10;p2 | Mohan Singh | 2500&#10;p3 | Lakshmi Bai | 2000&#10;p4 | Priya Kumari | 1500&#10;treasury | Cooperative Treasury | 500"></textarea>
      <div style="font-size:11px;color:var(--ink3);margin-top:6px">10000 bps = 100%. Lead beneficiary (first row) absorbs the rounding remainder so the split always reconciles to the input.</div>
      <button class="btn btn-saffron" style="margin-top:12px" onclick="_addCoop()">Create cooperative</button>
    </div></div>

    ${coops.length === 0 ? `<div class="card">${_emptyState('settlements','No cooperatives yet','Add your first cooperative above. The form takes the cooperative name, region, and a list of beneficiaries with their share in basis points. Once added, you can preview any hypothetical sale to see the paise-exact split.')}</div>`
    : coops.map(c => `<div class="card" style="margin-bottom:14px"><div class="chead"><h3>${c.name}</h3><span class="meta">${c.region} · ${c.beneficiaries.length} member${c.beneficiaries.length === 1 ? '' : 's'}</span></div><div class="cpad">
      ${c.beneficiaries.map(b => `<div class="drow"><span class="k">${b.name} <span style="font-size:10px;color:var(--ink3)">(${b.id})</span></span><span class="v">${(b.share_bps/100).toFixed(2)}%</span></div>`).join('')}

/* ════════ RENDER CONTENT + WIRE ════════ */
function renderContent(){
  const el=$('content');if(!el)return;
  if(ROLE==='buyer'){BUYER=BUYER_DISPLAY[BUYER_MOD];MODALITY=BUYER_MOD;el.innerHTML=(BUYER_VIEWS[route.buyer]||BUYER_VIEWS.home)();}
  else if(ROLE==='seller'){SELLER=SELLER_PROFILES[SELLER_KEY];el.innerHTML=(SELLER_VIEWS[route.seller]||SELLER_VIEWS.overview)();}
  else if(ROLE==='founder'){el.innerHTML=(FOUNDER_VIEWS[route.founder]||FOUNDER_VIEWS.dashboard)();}
}
function wire(){
  // Shared top-bar utility cluster + profile menu + footer links must be
  // wired for EVERY role. They used to live at the bottom of wire(), after
  // the buyer/seller `return`s — so for buyers and sellers the Home /
  // Settings / Profile / Cart buttons were dead. Wire them first.
  wireShared();

  // nav items (rail + data-go buttons)
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    route[ROLE]=b.dataset.go;
    // Close mobile drawer when a nav item is tapped
    const rail = $('rail'); if (rail) rail.classList.remove('open');
    const bd = $('drawerBackdrop'); if (bd) bd.classList.remove('show');
    render();
  });
  renderContent();
  // re-bind data-go created inside content
  document.querySelectorAll('#content [data-go]').forEach(b=>b.onclick=()=>{route[ROLE]=b.dataset.go;render();});

  // Founder command bar — the always-present AI operating layer.
  const fcmdIn=$('fcmdInput'), fcmdGo=$('fcmdGo');
  if(fcmdIn && fcmdGo){
    const run=()=>{ const v=fcmdIn.value.trim(); if(v) _fcmdRun(v); };
    fcmdGo.onclick=run;
    fcmdIn.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); run(); } });
  }

  // Mobile drawer toggle — hamburger button visible only below 700px
  const menuBtn = $('menuBtn');
  const rail = $('rail');
  const backdrop = $('drawerBackdrop');
  if (menuBtn && rail && backdrop) {
    menuBtn.onclick = () => {
      const isOpen = rail.classList.toggle('open');
      backdrop.classList.toggle('show', isOpen);
      menuBtn.setAttribute('aria-expanded', String(isOpen));
    };
    backdrop.onclick = () => {
      rail.classList.remove('open');
      backdrop.classList.remove('show');
      menuBtn.setAttribute('aria-expanded', 'false');
    };
  }

  if(ROLE==='buyer'){
    // modality switcher (topbar)
    const md=$('modalitySwitch');if(md)md.onchange=(e)=>{BUYER_MOD=e.target.value;MODALITY=BUYER_MOD;BUYER=BUYER_DISPLAY[BUYER_MOD];route.buyer='home';render();};
    // modality switch hint links on the storefront hero
    document.querySelectorAll('.modlink').forEach(b=>b.onclick=()=>{BUYER_MOD=b.dataset.mod;MODALITY=BUYER_MOD;BUYER=BUYER_DISPLAY[BUYER_MOD];route.buyer='home';render();toast('Switched to '+BUYER_MODALITIES[BUYER_MOD].label);});
    // add to cart
    document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.add;const p=CATALOG.find(x=>x.id===id);
      const existing=cart.items.find(i=>i.id===id);
      if(existing){existing.qty++;}else{cart.items.push({id:p.id,title:p.title,artisan:p.artisan,price:p.price,img:p.img,qty:1});}
      toast(p.title+' → '+(BUYER_MODALITIES[BUYER_MOD].cta.includes('quote')?'quote':'cart'));render();
    });
    // remove from cart
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart.items=cart.items.filter(i=>i.id!==b.dataset.rm);render();});
    // checkout (D2C / EXIM) — calls the SAME engine endpoint
    const bp=$('buyerPayBtn');if(bp)bp.onclick=async()=>{
      if(!cart.items.length){toast('Cart is empty',true);return;}
      try{
        const subtotal=cart.items.reduce((s,i)=>s+i.qty*i.price,0);
        const seller=mock.customers[0]||await api('/onboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isMaker:true,hasVoterId:true,language:'hi'})});
        const prod=await api('/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:seller.id,title:cart.items.map(i=>i.title).join(' + '),vertical:'handicraft',supplierPrice:Math.round(subtotal*0.65),sellPrice:subtotal,language:'hi'})});
        await api('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:prod.id,buyerName:'Buyer',isExport:BUYER_MOD==='exim',paymentMethod:'upi',authPayload:{vpa:$('buyerVpa').value}})});
        cart.items=[];toast(BUYER_MOD==='exim'?'Order placed — export docs prepared':'Paid — maker is settled in T+2');route.buyer='orders';render();
      }catch(e){toast(e.message,true);}
    };
    return;
  }

  if(ROLE==='seller'){const ms=$('modelSwitch');if(ms)ms.onchange=(e)=>{SELLER_KEY=e.target.value;SELLER=SELLER_PROFILES[SELLER_KEY];route.seller='overview';render();};return;}

  // founder interactions
  const pt=$('profTog');if(pt)PROFILE_OPTS.forEach(([k,l])=>{const b=document.createElement('button');b.className=sellProfile[k]?'on':'';b.innerHTML=`<span class="tk">${sellProfile[k]?'✓':''}</span>${l}`;b.onclick=()=>{sellProfile[k]=!sellProfile[k];if(k==='isExporter'&&sellProfile[k])sellProfile.isRegisteredBusiness=true;b.className=sellProfile[k]?'on':'';b.querySelector('.tk').textContent=sellProfile[k]?'✓':'';};pt.appendChild(b);});
  const ob=$('onboardBtn');if(ob)ob.onclick=async()=>{sellProfile.name=$('sName').value;sellProfile.language=$('sLang').value;const c=await api('/onboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sellProfile)});fstate.customer=c;fstate.product=null;render();toast(c.blocks?.length?'Seller blocked':'Model: '+MODEL_LABEL[c.model]);};

  const seg=$('paySeg');if(seg){seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{payMethod=b.dataset.m;render();});const pf=$('payFields');if(pf)pf.innerHTML=payMethod==='upi'?`<div class="field"><label>UPI ID (VPA)</label><input class="inp" id="vpa" value="sophie@oksbi"></div>`:`<div class="field"><label>Card token (PCI-safe)</label><input class="inp" id="cardTok" value="tok_visa_4242"></div>`;}
  const et=$('expTog');if(et)et.onclick=()=>{et.classList.toggle('on');et.querySelector('.tk').textContent=et.classList.contains('on')?'✓':'';};
  const pb=$('payBtn');if(pb)pb.onclick=async()=>{const auth=payMethod==='upi'?{vpa:$('vpa').value}:{cardToken:$('cardTok').value};

    const gates=[];
    const fg=cpGate({agent:'Finance',summary:'Settle '+fstate.product.title+' — '+inr(fstate.product.sellPrice),amountPaise:amt,recommendation:'approve'});
    if(fg.held)gates.push('Finance');
    if(isExport){const cg=cpGate({agent:'Compliance',summary:'Export compliance for '+fstate.product.title,amountPaise:amt,govSubmission:true,recommendation:'review'});if(cg.held)gates.push('Compliance');}
    if(gates.length){$('payResult').innerHTML=`<div class="card pop"><div class="chead"><h3>Held for your approval</h3><span class="bdg amber" style="margin-left:auto">${gates.length} gate${gates.length>1?'s':''}</span></div><div class="cpad">
      <div class="note" style="background:var(--gold-soft);border-color:#e8c78a;color:var(--gold)"><span class="ni">⚑</span><div>This order is paused. The founder must approve it before any money moves — that is human-in-the-loop, enforced, not just labelled.</div></div>
      <div style="margin-top:12px"><button class="btn btn-saffron full" data-go="approvals">Go to Approvals (${CP.pending.length}) →</button></div></div></div>`;
      toast(gates.join(' + ')+' held for approval');return;}
    const o=await api('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:fstate.product.id,buyerName:$('bName').value,isExport,paymentMethod:payMethod,authPayload:auth})});
    $('payResult').innerHTML=fpay(o);toast('Settled via '+payMethod.toUpperCase());
    document.querySelectorAll('#content [data-go]').forEach(b=>b.onclick=()=>{route[ROLE]=b.dataset.go;render();});};
  const tc=$('tcat');if(tc)TCATS.forEach(([k,l])=>{const b=document.createElement('button');b.className=tourCat===k?'on':'';b.innerHTML=`<span class="tk">${tourCat===k?'✓':''}</span>${l}`;b.onclick=()=>{tourCat=k;render();};tc.appendChild(b);});
  const tt=$('ttier');if(tt)tt.querySelectorAll('button').forEach(b=>b.onclick=()=>{tourTier=+b.dataset.t;render();});
  const bb=$('bookBtn');if(bb)bb.onclick=async()=>{const r=await api('/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking:{category:tourCat},identity:{kycTier:tourTier},operator:{licenseVerified:true,cglIndemnity:true,adventureInsuranceBound:true}})});$('bookResult').innerHTML=fbook(r);toast(r.allowed?'Allowed':'Blocked');};

  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>cpDecide(b.dataset.approve,'approved','Founder',''));

  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>cpDecide(b.dataset.reject,'rejected','Founder','held back'));

  document.querySelectorAll('[data-force]').forEach(b=>b.onclick=()=>{const c=b.dataset.force;CP.force.has(c)?CP.force.delete(c):CP.force.add(c);render();});
  document.querySelectorAll('[data-thresh]').forEach(inp=>inp.onchange=()=>{CP.thresholds[inp.dataset.thresh]=Math.round(+inp.value*100);toast('Threshold updated — effective now');});
  // cofounder page wiring (full AI page, parallels the floating panel)
  const cfBtn=$('cfSendBtn');const cfIn=$('cfInput');const cfBody=$('cfBody');const cfSuggBox=$('cfSugg');
  const cfNewBtn=$('cfNewBtn');
  const cfHistBtn=$('cfHistBtn');const cfHistPanel=$('cfHistPanel');const cfHistList=$('cfHistList');const cfHistCloseBtn=$('cfHistCloseBtn');
  if(cfBtn&&cfIn&&cfBody){
    // Try to rehydrate the most recent conversation from the server (last 24h)
    _loadLastConversation().then(() => _renderChatHistory(cfBody));
    // Fetch the ops health snapshot so the system prompt has live data
    _loadOpsFromAPI();
    // Render whatever history we have on entering the page
    _renderChatHistory(cfBody);
    // Render the tool-call audit log
    _renderToolAudit();

    if (cfNewBtn) {
      cfNewBtn.onclick = () => {
        if (window._chat.history.length > 0
            && !confirm('Start a fresh conversation? The current one will be saved in history.')) return;
        window._chat.history = [];
        window._chat.conversationId = null;
        _renderChatHistory(cfBody);
        toast('Started a new conversation.');
      };
    }

    // History panel — toggle + populate from /api/conversations
    const renderHistoryList = async () => {
      if (!cfHistList) return;
      cfHistList.innerHTML = '<div style="color:var(--ink3);padding:8px 0">Loading…</div>';
      try {
        const r = await fetch('/api/conversations');
        if (!r.ok) { cfHistList.innerHTML = '<div style="color:var(--ink3);padding:8px 0">Could not load history.</div>'; return; }
        const data = await r.json();
        const convs = data.conversations || [];
        if (convs.length === 0) {
          cfHistList.innerHTML = '<div style="color:var(--ink3);padding:8px 0">No past conversations yet. Ask the AI co-founder a question to start one.</div>';
          return;
        }
        cfHistList.innerHTML = convs.map(c => {
          const ago = _timeAgo(c.updated_at);
          const isCurrent = c.id === window._chat.conversationId;
          return `<div style="display:flex;gap:10px;align-items:center;padding:8px 10px;background:${isCurrent?'var(--brand-soft)':'#fff'};border:1px solid var(--hair2);border-radius:6px">
            <div style="flex:1;min-width:0">
              <div style="font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.preview || '(no preview)'}${isCurrent?' <span style="color:var(--brand);font-size:10px;font-weight:600">· current</span>':''}</div>
              <div style="font-size:10.5px;color:var(--ink3);margin-top:2px">${c.turn_count} turn${c.turn_count===1?'':'s'} · ${ago}</div>
            </div>
            ${isCurrent?'':`<button class="btn" style="padding:3px 9px;font-size:10.5px" onclick="_resumeConv('${c.id}')" aria-label="Resume this conversation">Resume</button>`}
            <button class="btn" style="padding:3px 9px;font-size:10.5px;color:var(--red);border-color:#e8b4b4" onclick="_deleteConv('${c.id}')" aria-label="Delete this conversation">✕</button>
          </div>`;
        }).join('');
      } catch (e) {
        cfHistList.innerHTML = '<div style="color:var(--red);padding:8px 0">Error loading history: '+e.message+'</div>';
      }
    };

    if (cfHistBtn) {
      cfHistBtn.onclick = () => {
        const show = cfHistPanel.style.display === 'none';
        cfHistPanel.style.display = show ? 'block' : 'none';
        if (show) renderHistoryList();
      };
    }
    if (cfHistCloseBtn) cfHistCloseBtn.onclick = () => { cfHistPanel.style.display = 'none'; };

    // Resume / delete handlers — exposed globally for the inline onclick
    window._resumeConv = async (id) => {
      if (window._chat.history.length > 0
          && !confirm('Switch to a different conversation? The current one will be saved.')) return;
      try {
        const r = await fetch('/api/conversations/'+id);
        if (!r.ok) { toast('Could not load that conversation', true); return; }
        const conv = await r.json();
        window._chat.history = (conv.turns||[]).map(t => ({ role: t.role, content: t.content }));
        window._chat.conversationId = conv.id;
        _renderChatHistory(cfBody);
        cfHistPanel.style.display = 'none';
        toast('Resumed conversation.');
      } catch (e) { toast('Error: '+e.message, true); }
    };
    window._deleteConv = async (id) => {
      if (!confirm('Delete this conversation permanently?')) return;
      try {
        const r = await fetch('/api/conversations/'+id, { method: 'DELETE' });
        if (!r.ok) { toast('Could not delete', true); return; }
        if (window._chat.conversationId === id) {
          window._chat.history = [];
          window._chat.conversationId = null;
          _renderChatHistory(cfBody);
        }
        renderHistoryList();
        toast('Conversation deleted.');
      } catch (e) { toast('Error: '+e.message, true); }
    };

    const cfAsk = async (q) => {
      if (window._chat.busy) return;
      // Optimistic UI: append user message AND set busy=true so the renderer
      // shows the "thinking…" indicator. The user sees their message in the
      // chat instantly + a busy indicator below it. Then _chatSend takes over
      // and either streams a response or renders one when done.
      window._chat.history.push({ role: 'user', content: q });
      window._chat.busy = true;
      _renderChatHistory(cfBody);
      // Pop the user message back off — _chatSend re-appends it. We do this
      // so the user-side render and the API-side history stay in sync.
      window._chat.history.pop();
      // Leave busy=true so the renderer keeps showing the busy state. The
      // first text_delta from the stream will replace the busy bubble.
      const result = await _chatSend(q);
      // busy is reset inside _chatSend's finally{}; this re-renders the
      // assembled history including the assistant's final reply.
      _renderChatHistory(cfBody);
      if (result && !result.ok) {
        const tip = document.createElement('div');
        tip.style.cssText = 'font-size:11px;color:var(--ink3);text-align:center;margin:4px 0';
        tip.textContent = '(answered from local fallback — API unreachable)';
        cfBody.appendChild(tip);
        cfBody.scrollTop = cfBody.scrollHeight;
      }
    };

    cfBtn.onclick = () => { const v = cfIn.value.trim(); if (!v) return; cfIn.value = ''; cfAsk(v); };
    cfIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); cfBtn.onclick(); } });

    if (cfSuggBox) {
      // Two stacked sections: live insights (priority actions) + suggested prompts
      const ins = generateInsights();
      cfSuggBox.innerHTML = '';

      // Priority insight cards
      if (ins.length > 0) {
        const header = document.createElement('div');
        header.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px';
        header.textContent = 'Priority insights';
        cfSuggBox.appendChild(header);
        ins.slice(0, 3).forEach(i => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.marginBottom = '10px';
          const pcol = { critical: 'var(--red)', high: 'var(--saffron)', med: 'var(--gold)', low: 'var(--ink3)' }[i.priority];
          const plbl = { critical: 'CRITICAL', high: 'HIGH', med: 'MED', low: 'LOW' }[i.priority];
          card.innerHTML = `<div class="cpad" style="padding:14px 16px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${pcol}"></span>
              <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:${pcol}">${plbl}</span>
              <span style="font-size:10px;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;margin-left:auto">${i.domain}</span>
            </div>
            <div style="font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:4px">${i.text}</div>
            <div style="font-size:12px;color:var(--ink3);margin-bottom:10px">${i.reason}</div>
            <div style="display:flex;gap:6px">
              <button class="btn btn-saffron" style="padding:5px 12px;min-height:32px;font-size:11.5px" data-act="go">${i.cta} →</button>
              <button class="btn" style="padding:5px 12px;min-height:32px;font-size:11.5px" data-act="ask">Discuss</button>
            </div>
          </div>`;
          card.querySelector('[data-act="go"]').onclick = () => runInsightAction(i.actionKey);
          card.querySelector('[data-act="ask"]').onclick = () => {
            cfIn.value = `Tell me more about this — ${i.text}. What should I do about it?`;
            cfBtn.onclick();
          };
          cfSuggBox.appendChild(card);
        });
      }

      // Suggested prompts (state-aware quick-starts)
      const prompts = _chatSuggestedPrompts();
      if (prompts.length > 0) {
        const phead = document.createElement('div');
        phead.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin:14px 0 8px';
        phead.textContent = 'Suggested questions';
        cfSuggBox.appendChild(phead);
        prompts.forEach(q => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.cssText = 'text-align:left;width:100%;padding:10px 14px;margin-bottom:6px;font-size:12.5px;line-height:1.45;height:auto;justify-content:flex-start';
          btn.textContent = q;
          btn.onclick = () => { cfIn.value = q; cfBtn.onclick(); };
          cfSuggBox.appendChild(btn);
        });
      }

      if (ins.length === 0 && prompts.length === 0) {
        cfSuggBox.innerHTML = '<div class="empty" style="padding:18px"><div class="ee">✦</div>' + dockHeadline() + '</div>';
      }
    }
  }

}

/* Shared wiring for the top-bar utility cluster, profile menu, settings
   overlay, and footer links. Called at the TOP of wire() for every role so
   these controls work for buyers and sellers too (not just the founder). */
function wireShared(){
  // Utility cluster buttons (top-right: Home / Alerts / Settings / Profile / Cart)
  document.querySelectorAll('[data-util]').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const u=btn.dataset.util;
      if(u==='home'){
        // role-aware: buyer→home, seller→overview, founder→dashboard
        if(ROLE==='buyer'){route.buyer='home';render();}
        else if(ROLE==='seller'){route.seller='overview';render();}
        else if(ROLE==='founder'){route.founder='dashboard';render();}
      } else if(u==='notif'){
        // Founder alerts → approvals queue
        if(ROLE==='founder'){route.founder='approvals';render();}
      } else if(u==='cart'){
        // Buyer cart
        if(ROLE==='buyer'){route.buyer='cart';render();}
      } else if(u==='settings'){
        const bg=$('settingsBg'); if(bg){renderSettings();bg.classList.add('show');}
      } else if(u==='profile'){
        const menu=$('umenu'); if(menu){renderProfileMenu();menu.classList.toggle('show');}
      }
    };
  });

  // Profile menu items
  document.querySelectorAll('[data-um]').forEach(btn=>{
    btn.onclick=()=>{
      const action=btn.dataset.um;
      const menu=$('umenu'); if(menu) menu.classList.remove('show');
      if(action==='home'){
        if(ROLE==='buyer'){route.buyer='home';render();}
        else if(ROLE==='seller'){route.seller='overview';render();}
        else if(ROLE==='founder'){route.founder='dashboard';render();}
      } else if(action==='settings'){
        const bg=$('settingsBg'); if(bg){renderSettings();bg.classList.add('show');}
      } else if(action==='help'){
        // In-app help: route to a help view if it exists, else show a toast
        if(ROLE==='seller'&&SELLER_VIEWS.help){route.seller='help';render();}
        else if(typeof toast==='function')toast('Help: voice support, WhatsApp, and the in-app guide are coming. For now, write to hello@nexus.example.');
      } else if(action==='logout'){
        // Demo: reset to buyer-anonymous (in production this would clear session)
        ROLE='buyer'; route.buyer='home';
        document.querySelectorAll('.roleswitch button').forEach(x=>x.classList.toggle('on',x.dataset.r==='buyer'));
        render();
        if(typeof toast==='function')toast('Signed out (demo).');
      }
    };
  });

  // Settings overlay close
  const sclose=$('settingsClose');
  if(sclose) sclose.onclick=()=>$('settingsBg').classList.remove('show');
  // Click on settings backdrop dismisses it
  const sbg=$('settingsBg');
  if(sbg) sbg.onclick=(e)=>{if(e.target===sbg) sbg.classList.remove('show');};

  // Footer link wiring
  document.querySelectorAll('[data-footer-page]').forEach(a=>{
    a.onclick=(e)=>{e.preventDefault();const p=a.dataset.footerPage;
      const overlayPages=['privacy','terms','returns','grievance','about','pricing','contact','press','careers','onboarding','payouts'];
      if(overlayPages.includes(p)){
        renderPolicyOverlay(p);
      } else {
        toast(`The ${p.charAt(0).toUpperCase()+p.slice(1)} page is coming soon.`);
      }
    };
  });
  document.querySelectorAll('[data-mod-link]').forEach(a=>{
    a.onclick=(e)=>{e.preventDefault();const m=a.dataset.modLink;
      if(ROLE!=='buyer'){if(typeof window._role==='function')window._role('buyer');}
      BUYER_MOD=m;MODALITY=m;if(typeof BUYER_DISPLAY!=='undefined'&&BUYER_DISPLAY[m])BUYER=BUYER_DISPLAY[m];
      route.buyer='home';render();
      if(typeof toast==='function')toast('Switched to '+(BUYER_MODALITIES[m]?BUYER_MODALITIES[m].label:m));
    };
  });

  // Profile menu: close on outside click (avoid trapping forever)
  if(!window._umenuOutsideBound){
    window._umenuOutsideBound=true;
    document.addEventListener('click',(e)=>{
      const menu=$('umenu');
      if(menu&&menu.classList.contains('show')&&!menu.contains(e.target)&&!e.target.closest('[data-util="profile"]')){
        menu.classList.remove('show');
      }
    });
  }
}

// Helper: render the profile-menu header with the current user's name + role
function renderProfileMenu(){
  const un=$('uname'); const ur=$('urole');
  if(!un||!ur) return;
  const who = ROLE==='founder' ? 'Founder' : ROLE==='seller' ? (SELLER&&SELLER.name||'Seller') : (BUYER&&BUYER.name||'Guest');
  const rolelbl = ROLE==='founder' ? 'Full control' : ROLE==='seller' ? (SELLER&&SELLER.model||'') : (BUYER&&BUYER.label||'Browsing as buyer');
  un.textContent = who;
  ur.textContent = rolelbl;
  // Translate menu items (rendered as static HTML; refresh on each open)
  document.querySelectorAll('#umenu .umi').forEach(b=>{
    const lbl=b.dataset.um;
    const span=b.querySelector('.uii');
    const iconHtml=span?span.outerHTML:'';
    const labels={home:t('common.home'),settings:t('common.settings'),help:t('common.help'),logout:t('common.signout')};
    b.innerHTML=iconHtml+(labels[lbl]||lbl);
  });
}

// via the public-policy HTTP endpoint.
function renderPolicyOverlay(name){
  // Live founder-set price for a tier (paise→display), else the default shown.
  const _lp=(tier,fallback)=>{const lp=window._livePricing&&window._livePricing[tier];return lp&&lp.price_paise!=null?('₹'+(lp.price_paise/100).toLocaleString('en-IN')):fallback;};
  const titles={privacy:'Privacy Policy',terms:'Terms of Service',returns:'Returns &amp; Refunds',grievance:'Grievance Redressal',
    about:'About NEXUS',pricing:'Pricing &amp; Tiers',contact:'Contact',press:'Press &amp; Media',careers:'Careers',
    onboarding:'How onboarding works',payouts:'Settlements &amp; T+2'};
  const bodies={
    privacy:`<p style="line-height:1.65;color:var(--ink2)"><b>NEXUS Commerce Pvt Ltd</b> is committed to protecting your personal data under the Digital Personal Data Protection Act, 2023.</p>
      <h4 style="margin-top:18px">Data we collect</h4><p style="line-height:1.6;font-size:13px">Account data (name, contact, identification documents), transaction data (orders, settlements), and technical data (device, IP, usage) for security and product improvement.</p>
      <h4 style="margin-top:14px">Your rights</h4><p style="line-height:1.6;font-size:13px">You may request access, correction, or erasure of your data, and withdraw consent at any time, by contacting our Data Protection Officer.</p>

    about:`<p style="line-height:1.65;color:var(--ink2)">NEXUS exists because the middleman is broken.</p>
      <p style="line-height:1.65;color:var(--ink2);margin-top:14px">India has seven million artisans. Most of them sell through middlemen who take fifty to seventy percent of the final price. The artisan in the village has no GST number, no bank statements, no compliance team. The buyer in Berlin has no way to verify the craft is real. The platform sits in the middle, holds the money for thirty days, and charges the seller for "marketing services" they never agreed to.</p>
      <p style="line-height:1.65;color:var(--ink2);margin-top:14px">We are building the opposite of that. The platform never holds the float — the payment gateway splits every sale at the moment of capture and routes the maker's share to their bank in two days. The platform's legal model adapts to the seller: an undocumented artisan gets Merchant-of-Record status (we sell, we file GST, they keep ninety percent); a registered exporter gets SaaS subscription with their own GSTIN; a tourism operator gets agent/intermediary status; a cooperative gets umbrella billing. The math of every transaction is auditable to the paise. The donation slice is built into the math, not solicited as a popup.</p>
      <h4 style="margin-top:18px">What we believe</h4>
      <ul style="margin:6px 0 0 18px;line-height:1.75;font-size:13.5px">
        <li>Authentic Indian craft is undervalued because the buyer can't verify it. GI verification with origin trail fixes that.</li>
        <li>The maker should be the first paid, not the last. T+2 to the maker's bank, every sale, no exceptions.</li>
        <li>Compliance should be the platform's problem, not the artisan's. Status-aware legal model means the platform absorbs the regulatory complexity.</li>
        <li>A craft platform that serves an artisan with no GST number and no smartphone is harder to build than one that doesn't. We build the harder version.</li>
      </ul>
      <h4 style="margin-top:16px">Where we are</h4>
      <p style="line-height:1.65;font-size:13.5px">Founded 2026. Based in Jaipur, Rajasthan. Built in public, test-first: the platform engine is covered by a comprehensive automated test suite spanning payments, compliance, sourcing, and the full order lifecycle. Production launch follows real-world validation — onboarding conversations with GI boards and gem-export councils, and a live payment-settlement account.</p>`,

    contact:`<p style="line-height:1.65;color:var(--ink2)">We're a small team based in Jaipur. The fastest path to a useful conversation is to tell us who you are and what you're trying to do.</p>

    press:`<p style="line-height:1.65;color:var(--ink2)">NEXUS is currently in pre-launch. We're building in public. If you cover Indian crafts, fintech, B2B SaaS, or the artisan economy, we'd love to talk.</p>
      <h4 style="margin-top:18px">The angle</h4>
      <p style="font-size:13.5px;line-height:1.7">Most platforms serving Indian artisans replicate Amazon's playbook on top of a craft category. NEXUS does the opposite — the legal structure of every transaction adapts to who the seller is, the platform never holds float, and the payment math is auditable to the paise. The technical work is open to inspection. The business is honest about its constraints.</p>

    careers:`<p style="line-height:1.65;color:var(--ink2)">We're not hiring on a job board yet, because we're a small team building deliberately. But if you read the rest of this site and felt "I want to work on this exact problem," we want to hear from you.</p>
      <h4 style="margin-top:18px">What we'd hire for first</h4>
      <ul style="margin:6px 0 0 18px;line-height:1.75;font-size:13.5px">
        <li><b>Founding engineer (full-stack)</b> — comfortable in Node + browser-side modules + small infrastructure. The codebase is single-file SPA + Node backend + 17 test suites. You'd own a vertical end-to-end.</li>
        <li><b>Founding field operator (Jaipur or Surat)</b> — onboards real sellers, runs the human side of the loop, brings back the friction the engineers can't see from a screen.</li>

      <h4 style="margin-top:14px">What we're not</h4>

      <p style="font-size:13.5px;line-height:1.7">careers@nexus.example · Include your background, what you've shipped, and which of the three roles above resonates.</p>`,
    onboarding:`<p style="line-height:1.65;color:var(--ink2)">Most platforms onboard by demanding documents the seller doesn't have. NEXUS adapts to who you are.</p>

    payouts:`<p style="line-height:1.65;color:var(--ink2)">The platform never holds your money.</p>

      <p style="font-size:13.5px;line-height:1.7">When a buyer pays, Razorpay Route splits the payment at the moment of capture. The maker's share is routed directly to their bank account. The platform commission, GST, TCS, gateway fee, and donation slice settle to their respective accounts in the same transaction. Nothing pools on the platform balance sheet, ever.</p>

function findGI(query){
  const q=_giNorm(query); if(!q) return null;
  for(const e of GI_REGISTRY){if(_giNorm(e.gi)===q) return e; if(e.aliases.some(a=>_giNorm(a)===q)) return e;}
  for(const e of GI_REGISTRY){if(q.includes(_giNorm(e.gi))) return e;}
  for(const e of GI_REGISTRY){if(e.aliases.some(a=>q.includes(_giNorm(a)))) return e;}
  return null;
}
function verifyGI(product){
  const reasons=[];
  if(!product) return {status:'untagged',score:0,gi:null,reasons:[]};
  const hay=[product.claimedGI,product.title].filter(Boolean).join(' ');
  const gi=findGI(hay);
  if(!gi) return {status:'untagged',score:0,gi:null,reasons:[{ok:false,text:'No GI tag matched'}]};
  let score=60; reasons.push({ok:true,text:`Matched registered GI "${gi.gi}"`});
  const sr=_giNorm(product.sellerRegion||'');
  if(sr){
    const ok=gi.states.some(st=>sr.includes(_giNorm(st)))||sr.includes(_giNorm(gi.region));
    if(ok){score+=25;reasons.push({ok:true,text:`Seller region matches ${gi.region}`});}
    else{score-=35;reasons.push({ok:false,text:`Region "${product.sellerRegion}" does NOT match registered "${gi.region}"`});}
  } else reasons.push({ok:false,text:'Seller region not declared'});
  const cs=_giNorm((product.attributes&&(product.attributes.craft_technique||product.attributes.materials))||'');
  if(cs){
    const cw=_giNorm(gi.craft).split(' ').filter(w=>w.length>=4);
    if(cw.some(w=>cs.includes(w))){score+=12;reasons.push({ok:true,text:`Craft aligns with ${gi.craft}`});}
  }
  score=Math.max(0,Math.min(100,score));
  const status=score>=80?'verified':score>=50?'unverified':'suspicious';
  return {status,score,gi,reasons};
}

/* ════════════════════════════════════════════════════════════
   AI CO-FOUNDER CHAT LAYER
   Wired to the Anthropic API in-artifact. Builds a system prompt
   from live platform state (customers, orders, HITL queue, leads,
   returns, health, runbooks) and routes the founder's question
   through Claude with the right context. Conversation history is

window._chat = window._chat || { history: [], busy: false, conversationId: null };

/** Persist the current conversation to the server. Returns the
 *  conversation id (creates on first call). Silent on failure — the
 *  in-memory chat keeps working even if persistence is down. */
async function _persistConversation(){
  try {
    if (!window._chat.conversationId) {
      // First persistence — create a new conversation record
      const r = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turns: window._chat.history }),
      });
      if (r.ok) {
        const data = await r.json();
        window._chat.conversationId = data.id;
      }
    } else {
      // Existing conversation — replace turns wholesale (simpler than diffing)
      await fetch('/api/conversations/' + window._chat.conversationId, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turns: window._chat.history }),
      });
    }
  } catch (_) { /* silent — chat keeps working in memory */ }
}

/** Fetch the most recent conversation and rehydrate. Called on view open. */
async function _loadLastConversation(){
  if (window._chat.history.length > 0) return;  // already loaded
  try {
    const list = await fetch('/api/conversations').then(r => r.ok ? r.json() : null);
    if (!list || !list.conversations || list.conversations.length === 0) return;
    const mostRecent = list.conversations[0];
    const conv = await fetch('/api/conversations/' + mostRecent.id).then(r => r.ok ? r.json() : null);
    if (!conv || !Array.isArray(conv.turns)) return;
    // Only restore if the conversation is recent (last 24h) — older starts fresh
    if (Date.now() - conv.updated_at > 24 * 60 * 60 * 1000) return;
    window._chat.history = conv.turns.map(t => ({ role: t.role, content: t.content }));
    window._chat.conversationId = conv.id;
  } catch (_) { /* silent — start fresh */ }
}

/** Build a message slice for the Anthropic API that respects tool_use ↔
 *  tool_result pair integrity. The API rejects a request whose first
 *  message is an "orphan" user tool_result (with no preceding assistant
 *  tool_use), or whose last assistant message has tool_use blocks without
 *  matching tool_result blocks in the next user message.
 *
 *  Strategy: take the last `maxTurns` entries, then walk forward from
 *  the start until we find a clean boundary — a user turn whose content
 *  is NOT a tool_result array. Drop anything before that.
 */
function _sliceForAPI(history, maxTurns) {
  if (!Array.isArray(history) || history.length === 0) return [];
  const window_ = history.slice(-maxTurns);
  // Find the first clean boundary — a user turn whose content is either
  // a string OR a non-tool-result array.
  let startIdx = 0;
  for (let i = 0; i < window_.length; i++) {
    const turn = window_[i];
    if (turn.role !== 'user') continue;
    const isToolResults = Array.isArray(turn.content)
      && turn.content.length > 0
      && turn.content.every(b => b && b.type === 'tool_result');
    if (!isToolResults) { startIdx = i; break; }
  }
  return window_.slice(startIdx);
}
