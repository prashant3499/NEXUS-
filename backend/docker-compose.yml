# NEXUS — local/prod compose. App runs standalone; uncomment postgres for scale.
services:
  nexus:
    build: .
    ports:
      - "4100:4100"
    environment:
      NODE_ENV: production
      PORT: "4100"
      # ── Pilot defaults (safe). Flip these for live: ──
      PAYMENTS_PROVIDER: "mock"        # → "razorpay" when keys are ready
      STORE_DRIVER: "file"             # → "postgres" for scale
      AUTH_MODE: "none"                # → "jwt" before any public traffic
      # RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
      # RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
      # RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"
      # DATABASE_URL: "postgres://nexus:nexus@db:5432/nexus"
      # JWT_SECRET: "${JWT_SECRET}"
    volumes:
      - nexus-data:/app/data
    restart: unless-stopped
    # depends_on: [db]

  # Uncomment for production-scale persistence:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: nexus
  #     POSTGRES_PASSWORD: nexus
  #     POSTGRES_DB: nexus
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  nexus-data:
  # pg-data:
