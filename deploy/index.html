<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is NEXUS?", "acceptedAnswer": {"@type": "Answer", "text": "NEXUS is a trust and compliance platform for India's craft economy. As a status-aware Merchant of Record it lets undocumented artisans sell verified, provenance-tagged craft globally, handles GST and export compliance, and pays makers directly to their bank in about two days."}}, {"@type": "Question", "name": "How can an artisan sell on NEXUS without GST or a company?", "acceptedAnswer": {"@type": "Answer", "text": "NEXUS acts as the Merchant of Record, so the artisan does not need GST registration or a company. The platform carries the compliance burden; the maker keeps about 81% of each sale, paid to their own bank account."}}, {"@type": "Question", "name": "Is the craft sold on NEXUS authentic?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Every product carries registry-verified provenance and, where relevant, a GI tag, hallmark or lab certificate that the buyer can verify. NEXUS never lists fabricated or unverified high-value items."}}, {"@type": "Question", "name": "What can I buy on NEXUS?", "acceptedAnswer": {"@type": "Answer", "text": "Verified Indian craft across every vertical: handicraft and home decor, handloom textiles, jewellery, gemstones, sustainable naturals, and hands-on craft experiences and workshops."}}, {"@type": "Question", "name": "How does NEXUS benefit artisans and government?", "acceptedAnswer": {"@type": "Answer", "text": "Artisans get global market access, fair pay and formalisation. Government benefits because NEXUS verifies and formalises artisans (e-Shram, Udyam, GI) and can route schemes such as PM Vishwakarma to verified beneficiaries with an outcome dashboard."}}]}</script>
<style>
  :root{
    /* INDIGO & BRASS — a heritage craft house. Grounded in indigo dye + brass + handloom. */
    --ink:#221C33; --ink2:#574F66; --ink3:#938BA1;
    --paper:#F3EFE6; --surface:#FCFAF4; --raise:#FCFAF4;
    --line:#E3DCCD; --line2:#EDE7D9;
    --indigo:#272247; --indigo2:#39336A; --indigo-soft:#272247;
    --brass:#A06B2C; --brass-2:#B9893F; --brass-soft:#D8C29A;
    --madder:#8A3324; --sage:#5E6B4A;
    /* legacy aliases so JS-inlined colors still resolve onto the new palette */
    --saffron:var(--brass); --gold:var(--brass); --teal:var(--sage); --tealink:#48522F;
    --green:var(--sage); --maker:var(--sage); --red:#A33326; --gold-soft:#efe4cf; --green-soft:#e7eadd;
    --r:11px; --r-sm:7px; --ease:cubic-bezier(.22,1,.36,1);
    --sh1:0 1px 2px rgba(34,28,51,.05); --sh2:0 14px 38px rgba(34,28,51,.09); --sh3:0 30px 70px rgba(39,34,71,.18);
    --mono:"DM Mono",ui-monospace,Menlo,monospace;
    --warp:repeating-linear-gradient(90deg,transparent 0 13px,rgba(160,107,44,.05) 13px 14px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  body{font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  body[data-lang=hi]{font-family:"Noto Sans Devanagari","Nirmala UI",-apple-system,sans-serif}
  .sans{font-family:"Helvetica Neue",-apple-system,sans-serif}
  body[data-lang=hi] .sans{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .mono{font-family:var(--mono)}
  /* DISPLAY — high-contrast didone, the one bold type move. Used with restraint. */
  h1,h2,h3,.sh,.hero h1,.slide h2,.slide.cover h2,.price,.cfee{font-family:"Bodoni 72","Didot","Bodoni MT","Hoefler Text",Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.08}
  body[data-lang=hi] h1,body[data-lang=hi] h2,body[data-lang=hi] h3,body[data-lang=hi] .sh{font-family:"Noto Sans Devanagari","Nirmala UI",serif;font-weight:600}
  .wrap{max-width:1180px;margin:0 auto;padding:0 26px}
  /* selvedge: a fine brass rule at the very top, like the edge of woven cloth */
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--brass),var(--brass-2),var(--brass));z-index:60}
  header{position:sticky;top:0;z-index:50;background:rgba(243,239,230,.82);backdrop-filter:saturate(140%) blur(16px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:8px;height:66px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer}
  .logomark{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0}
  .logomark.seal{grid-template-columns:1fr 1fr;gap:2px;transform:rotate(45deg);transition:transform .7s var(--ease)}
  .logo:hover .logomark.seal{transform:rotate(225deg)}
  .logomark.seal i{display:block;border-radius:1px;width:100%;height:100%}
  .logomark.mono,.logomark.symbol{border-radius:6px;color:#fff;font-weight:700;font-size:13px}
  .navlinks{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;font-size:13px;align-items:center;font-weight:500}
  .navlinks button{background:0;border:0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 13px;border-radius:9px;color:var(--ink2);cursor:pointer;transition:.18s;position:relative}
  .navico{display:grid;place-items:center}
  .navico svg{width:23px;height:23px;display:block}
  .navtx{font-size:10.5px;letter-spacing:.04em}
  body[data-lang=hi] .navtx{font-size:11px}
  .navlinks button:hover{color:var(--ink)}
  .navlinks button:hover .navico{transform:translateY(-1px)}
  .navlinks button.active{color:var(--brass)}
  .navlinks button.active::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:1px;width:18px;height:1.5px;background:var(--brass)}
  body[data-lang=hi] .navlinks{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .cartcount{position:absolute;top:2px;right:6px;background:var(--brass);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:none;place-items:center;padding:0 3px;font-family:var(--mono)}
  .cartcount.show{display:grid}
  .langtog{display:flex!important;flex-shrink:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:8px}
  .langtog button{padding:7px 11px;border-radius:0;font-size:12px;letter-spacing:.04em;color:var(--ink);background:var(--surface);cursor:pointer;border:0}
  .langtog button.on{background:var(--indigo);color:var(--paper)}
  @media(max-width:740px){.navlinks{font-size:12px;gap:0}.navlinks>button{padding:8px 7px}.logo span{display:none}.langtog{margin-left:4px;width:100%;justify-content:center;margin-top:6px}}
  .view{display:none;animation:fade .5s var(--ease)}.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  section{padding:72px 0}
  /* EYEBROW — mono, tracked, brass. A ledger/registry voice for a compliance house. */
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--brass);opacity:.6}
  body[data-lang=hi] .eyebrow{letter-spacing:.1em;font-family:"Noto Sans Devanagari","Nirmala UI",monospace}
  .sh{font-size:clamp(30px,4.6vw,52px);max-width:18ch;margin-bottom:18px;line-height:1.06}
  .sp{font-size:17px;color:var(--ink2);max-width:60ch;line-height:1.65}
  .btn{font-family:"Helvetica Neue",-apple-system,sans-serif;font-size:14px;font-weight:600;letter-spacing:.02em;padding:14px 28px;border-radius:var(--r-sm);border:0;cursor:pointer;display:inline-block;transition:transform .18s var(--ease),background .18s,box-shadow .18s}
  body[data-lang=hi] .btn{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .btn-primary{background:var(--indigo);color:var(--paper);box-shadow:0 8px 24px rgba(39,34,71,.22)}
  .btn-primary:hover{background:var(--indigo2);transform:translateY(-2px)}
  .btn-ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
  .btn-ghost:hover{background:var(--ink);color:var(--paper)}
  /* HERO — type is the hero. Warp-thread texture behind, like cloth on the loom. */
  .hero{padding:96px 0 80px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:var(--warp);opacity:.9;pointer-events:none;-webkit-mask:linear-gradient(180deg,#000,transparent 75%);mask:linear-gradient(180deg,#000,transparent 75%)}
  .hero .wrap{position:relative}
  .hero h1{font-size:clamp(44px,8vw,92px);max-width:13ch;line-height:1;letter-spacing:-.02em;animation:rise .7s var(--ease)}
  .hero h1 .em{font-style:italic;color:var(--brass)}
  .hero .lead{font-size:clamp(16px,2vw,20px);color:var(--ink2);max-width:52ch;margin-top:26px;line-height:1.6;animation:rise .7s var(--ease) .08s both}
  .hero .quote{font-family:"Bodoni 72","Didot",Georgia,serif;font-style:italic;font-size:clamp(17px,2.2vw,21px);color:var(--ink);margin-top:30px;max-width:60ch;padding-left:22px;border-left:2px solid var(--brass);line-height:1.5;animation:rise .7s var(--ease) .16s both}
  body[data-lang=hi] .hero .quote{font-family:"Noto Sans Devanagari","Nirmala UI",serif}
  .hcta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap;animation:rise .7s var(--ease) .24s both}
  .grid{display:grid;gap:1px;margin-top:36px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  /* CARD — gallery framing: hairline rules, generous air, brass detail on hover */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px;box-shadow:none;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--brass-soft)}
  .card .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:17px;margin-bottom:18px;background:var(--line2)!important;color:var(--brass)!important;font-family:var(--mono)}
  .card h3{font-size:21px;margin-bottom:9px;font-weight:600}
  .card p{font-size:14.5px;color:var(--ink2);line-height:1.62}
  body[data-lang=hi] .card p{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .grid.g3{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .grid.g3 .card{border:0;border-radius:0}
  .trades{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}
  .trade{font-size:13px;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:.2s;letter-spacing:.01em}
  .trade:hover{border-color:var(--brass);color:var(--brass)}
  .trade .m{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:6px;text-transform:uppercase;letter-spacing:.08em}
  /* STAT STRIP — ledger row, mono figures, hairline separation */
  .statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  @media(max-width:600px){.statstrip{grid-template-columns:repeat(2,1fr)}}
  .statstrip .stat{text-align:center;padding:28px 16px;border-left:1px solid var(--line)}
  .statstrip .stat:first-child{border-left:0}
  @media(max-width:600px){.statstrip .stat:nth-child(odd){border-left:0}.statstrip .stat:nth-child(n+3){border-top:1px solid var(--line)}}
  .statstrip .sv{font-family:"Bodoni 72","Didot",Georgia,serif;font-size:36px;color:var(--indigo);line-height:1}
  .statstrip .sl{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:8px;text-transform:uppercase;letter-spacing:.12em}
  body[data-lang=hi] .statstrip .sl{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif;letter-spacing:.04em}
  /* SHOP */
  .shophero{background:var(--indigo);color:var(--paper);border-radius:0;padding:64px 0 56px;position:relative;overflow:hidden}
  .shophero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(216,194,154,.06) 15px 16px);-webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent)}
  .shophero .wrap{position:relative}
  .shophero .eyebrow{color:var(--brass-soft)}.shophero .eyebrow::before{background:var(--brass-soft)}
  .shophero h1{color:var(--paper);font-size:clamp(34px,5vw,58px)}
  .shophero p{color:#cfc8de;max-width:48ch;margin-top:16px;font-size:16px;line-height:1.6}
  body[data-lang=hi] .shophero p{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .shoptools{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;align-items:center}
  .searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 16px;transition:border-color .2s}
  .searchbox:focus-within{border-color:var(--brass)}
  .searchbox .si{color:var(--ink3);font-size:17px}
  .searchbox input{flex:1;border:0;background:0;font-size:14px;padding:14px 0;outline:none;color:var(--ink);font-family:inherit}
  #shopSort,.wishtog{font-size:13px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink2);cursor:pointer;font-family:inherit}
  .wishtog.on{border-color:var(--brass);color:var(--brass)}
  .collrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .coll{font-size:12px;padding:8px 16px;border-radius:999px;border:1px solid transparent;background:var(--line2);color:var(--ink2);cursor:pointer;transition:.2s;letter-spacing:.02em}
  .coll:hover{color:var(--brass)}.coll.on{background:var(--brass);color:#fff}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .filter .fico{margin-right:7px;font-size:14px}
  .filter{font-size:13px;padding:9px 15px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;transition:.18s}
  .filter:hover{border-color:var(--brass);color:var(--brass)}
  .filter.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .shopcount{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:22px 0 4px;text-transform:uppercase;letter-spacing:.1em}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:24px;margin-top:18px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;display:flex;flex-direction:column}
  .pcard:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--brass-soft)}
  .pthumb{height:172px;display:grid;place-items:center;font-size:54px;position:relative;border-bottom:1px solid var(--line)}
  .pverify{position:absolute;top:12px;left:12px;background:rgba(252,250,244,.94);color:var(--sage);font-family:var(--mono);font-size:10px;font-weight:500;padding:5px 9px;border-radius:999px;display:flex;align-items:center;gap:4px;letter-spacing:.06em;text-transform:uppercase}
  .pnat{position:absolute;top:42px;right:12px;background:rgba(94,107,74,.95);color:#fff;font-size:11px;padding:4px 7px;border-radius:999px}
  .pexp{position:absolute;top:12px;right:12px;background:var(--indigo);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 9px;border-radius:999px;letter-spacing:.06em}
  body[data-lang=hi] .pexp{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .pgi{position:absolute;top:12px;right:12px;background:var(--brass);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 9px;border-radius:999px;letter-spacing:.08em}
  .pbody{padding:20px;display:flex;flex-direction:column;flex:1}
  .pname{font-family:"Bodoni 72","Didot",Georgia,serif;font-size:19px;font-weight:600;margin-bottom:4px;line-height:1.2}
  body[data-lang=hi] .pname{font-family:"Noto Sans Devanagari","Nirmala UI",serif}
  .pmaker{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
  body[data-lang=hi] .pmaker{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .prate{display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .stars{color:var(--brass);font-size:12px;letter-spacing:2px}.stars .se{color:var(--line)}
  .rn{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .pprice{font-family:var(--mono);font-size:17px;color:var(--ink);margin-top:auto;letter-spacing:.01em}
  .heart{position:absolute;bottom:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(252,250,244,.94);color:var(--madder);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:transform .18s,border-color .18s}
  .heart:hover{transform:scale(1.12);border-color:var(--madder)}.heart.on{color:var(--madder);border-color:var(--madder)}
  .heart.big{width:42px;height:42px;font-size:20px;top:16px;right:16px;bottom:auto}
  /* MODAL / SHEET */
  .modal{position:fixed;inset:0;background:rgba(34,28,51,.55);backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center;padding:22px}
  .modal.show{display:flex;animation:fade .3s}
  .sheet{background:var(--paper);border-radius:var(--r);max-width:780px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh3)}
  .sheet .top{display:grid;grid-template-columns:1fr 1fr;gap:0}@media(max-width:600px){.sheet .top{grid-template-columns:1fr}}
  .sheet .pic{min-height:260px;display:grid;place-items:center;font-size:104px;position:relative;border-right:1px solid var(--line)}
  .sheet .info{padding:32px}
  .sheet .x{position:absolute;top:16px;right:18px;background:rgba(252,250,244,.92);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink2);z-index:2}
  .sheet h2{font-size:27px;margin-bottom:5px;font-weight:600}
  .makerlink{font-size:13px;color:var(--brass);cursor:pointer;margin-top:4px}.makerlink:hover{text-decoration:underline}.makerlink b{color:var(--ink)}
  body[data-lang=hi] .makerlink{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .sheet .price{font-family:"Bodoni 72","Didot",Georgia,serif;font-size:30px;margin:18px 0 4px}
  .sheet .split{font-size:12px;color:var(--sage);margin-bottom:18px;font-family:var(--mono);letter-spacing:.02em}
  body[data-lang=hi] .sheet .split{font-family:"Noto Sans Devanagari","Nirmala UI",sans-serif}
  .qtyrow{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);margin:16px 0}
  .qtyrow button{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:17px;cursor:pointer;color:var(--ink)}
