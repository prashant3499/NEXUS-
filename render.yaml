services:
  - type: web
    name: nexus
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev  # installs only pg — the sanctioned store driver
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: RATE_LIMIT
        value: "on"
